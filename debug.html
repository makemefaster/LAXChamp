<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-24 font-sans">
    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-lg flex justify-between">
        <h1 class="font-bold">Event Manager</h1>
        <div id="count" class="text-xs bg-blue-900 px-2 py-1 rounded">Loading...</div>
    </div>

    <div class="max-w-md mx-auto p-4" id="matchGrid"></div>

    <script type="module">
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(!eventId) alert("No Event ID");

        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const container = document.getElementById('matchGrid');
            container.innerHTML = '';
            
            if(!snap.exists()) {
                document.getElementById('count').innerText = "0 Matches";
                container.innerHTML = "No matches found.";
                return;
            }

            const matches = [];
            snap.forEach(child => {
                matches.push({ key: child.key, ...child.val() });
            });

            // Sort by Time
            matches.sort((a,b) => (a.timeSlot + a.field).localeCompare(b.timeSlot + b.field));
            
            document.getElementById('count').innerText = `${matches.length} Matches`;

            matches.forEach(m => {
                // Simple Render - No complex logic
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded shadow mb-2 border-l-4 border-indigo-500";
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-sm mb-1">
                        <span>${m.timeSlot} (Pitch ${m.field})</span>
                        <span class="text-xs uppercase text-slate-400">${m.division}</span>
                    </div>
                    <div class="flex justify-between items-center text-lg">
                        <span>${m.teamA}</span>
                        <span class="text-sm text-slate-300">vs</span>
                        <span>${m.teamB}</span>
                    </div>
                    <div class="mt-2 text-right">
                        ${m.status === 'live' ? 
                            '<span class="text-green-600 font-bold text-xs">● LIVE</span>' : 
                            `<button onclick="goLive('${m.key}')" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-xs font-bold">Start Match</button>`
                        }
                    </div>
                `;
                container.appendChild(div);
            });
        });

        window.goLive = (key) => {
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
            // Also update the single 'match' node for the umpire view
            // (Simplified for this fail-safe version)
        };
    </script>
</body>
</html>
