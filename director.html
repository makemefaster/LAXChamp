<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        <h1 class="text-3xl font-bold text-center mb-2">Director Portal</h1>
        <p class="text-slate-400 text-center mb-8 text-sm">Tournament Management System</p>

        <div id="loginSection">
            <input type="email" id="email" placeholder="Email" class="w-full mb-3 p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
            <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition">Login</button>
        </div>

        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <span class="font-bold text-lg">My Tournaments</span>
                <button onclick="logout()" class="text-xs text-red-400 hover:text-white transition">Sign Out</button>
            </div>

            <div id="eventList" class="space-y-3 mb-8 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                <div class="text-slate-500 text-center text-sm py-4">Loading events...</div>
            </div>

            <div class="pt-4 border-t border-slate-700">
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Create New Event</label>
                <div class="flex gap-2">
                    <input type="text" id="newEventName" placeholder="e.g. Winter Cup 2026" class="flex-1 p-2 rounded bg-slate-900 border border-slate-600 text-sm focus:outline-none focus:border-green-500 text-white">
                    <button onclick="createNewTournament()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-bold transition">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);

        // 1. AUTH LISTENER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadEvents(user.uid);
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        });

        // 2. ACTIONS
        window.login = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Login Failed: " + err.message));
        };

        window.logout = () => signOut(auth);

        window.createNewTournament = () => {
            const name = document.getElementById('newEventName').value;
            if(!name) return;

            const eventId = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            const uid = auth.currentUser.uid;

            set(ref(db, `tournaments/${eventId}`), {
                name: name,
                owner: uid,
                created: serverTimestamp(),
                active: true
            }).then(() => {
                window.location.href = `admin.html?event=${eventId}`;
            }).catch(err => alert(err.message));
        };

        // 3. LOAD LIST
        function loadEvents(uid) {
            onValue(ref(db, 'tournaments'), (snap) => {
                const list = document.getElementById('eventList');
                list.innerHTML = '';
                
                if(!snap.exists()) {
                    list.innerHTML = '<div class="text-slate-500 text-center text-sm py-4">No events found. Create one below!</div>';
                    return;
                }

                let hasEvents = false;
                snap.forEach(child => {
                    const event = child.val();
                    const id = child.key;
                    hasEvents = true;
                    
                    const div = document.createElement('div');
                    div.className = 'bg-slate-700 p-3 rounded flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 group hover:bg-slate-600 transition border border-slate-600';
                    div.innerHTML = `
                        <div>
                            <div class="font-bold text-white text-lg">${event.name}</div>
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider font-mono">ID: ${id}</div>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                            <a href="manage.html?event=${id}" class="flex-1 sm:flex-none text-center bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded font-bold no-underline transition">Manage</a>
                            
                            <button onclick="copyLink('${id}')" class="bg-slate-800 hover:bg-slate-900 border border-slate-600 text-slate-300 text-xs px-3 py-2 rounded" title="Copy Public Link">🔗</button>
                            <button onclick="duplicateEvent('${id}', '${event.name}')" class="bg-slate-800 hover:bg-orange-600 hover:text-white border border-slate-600 text-slate-300 text-xs px-3 py-2 rounded transition" title="Duplicate Event">📑</button>
                            <button onclick="deleteEvent('${id}')" class="bg-slate-800 hover:bg-red-600 hover:text-white border border-slate-600 text-slate-300 text-xs px-3 py-2 rounded transition" title="Delete Event">🗑️</button>
                        </div>
                    `;
                    list.appendChild(div);
                });

                if(!hasEvents) list.innerHTML = '<div class="text-slate-500 text-center text-sm">No events found.</div>';
            });
        }

        // --- UTILS ---

        window.copyLink = (id) => {
            const url = `${window.location.origin}${window.location.pathname.replace('director.html', '')}index.html?event=${id}`;
            navigator.clipboard.writeText(url);
            alert("Public Link Copied:\n" + url);
        }

        window.deleteEvent = (id) => {
            if(confirm(`⚠️ Are you sure you want to PERMANENTLY delete "${id}"?`)) {
                remove(ref(db, `tournaments/${id}`))
                    .then(() => alert("Deleted."))
                    .catch(e => alert(e.message));
            }
        };

        window.duplicateEvent = async (id, oldName) => {
            const newName = prompt("Name for the copy:", oldName + " (Copy)");
            if(!newName) return;

            const newId = newName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Math.floor(Math.random()*1000);

            try {
                // 1. Fetch old data
                const snap = await get(ref(db, `tournaments/${id}`));
                const data = snap.val();

                // 2. Clean Data (Reset Scores)
                if(data.schedule) {
                    Object.keys(data.schedule).forEach(key => {
                        data.schedule[key].scoreA = 0;
                        data.schedule[key].scoreB = 0;
                        data.schedule[key].status = 'scheduled';
                        data.schedule[key].isFinal = false; // Reset locks
                    });
                }
                
                // 3. Reset Live Match & Alerts
                data.match = { teamA: "TBD", teamB: "TBD", scoreA: 0, scoreB: 0, isRunning: false };
                data.alert = null;
                
                // 4. Update Meta
                data.name = newName;
                data.created = serverTimestamp();
                data.owner = auth.currentUser.uid;

                // 5. Save as new node
                await set(ref(db, `tournaments/${newId}`), data);
                
                if(confirm("Event Duplicated! Go to new event now?")) {
                    window.location.href = `manage.html?event=${newId}`;
                }
            } catch(e) {
                alert("Error duplicating: " + e.message);
            }
        };

    </script>
</body>
</html>
