<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-10">
    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between">
        <button onclick="history.back()">← Back</button>
        <h1 class="font-bold">Schedule</h1>
        <div></div>
    </div>
    <div id="list" class="max-w-2xl mx-auto"></div>

    <script type="module">
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const eventId = new URLSearchParams(window.location.search).get('event');
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const list = document.getElementById('list');
            list.innerHTML = '';
            snap.forEach(child => {
                const m = child.val();
                const div = document.createElement('div');
                div.className = 'bg-white p-4 border-b flex justify-between items-center';
                div.innerHTML = `
                    <div class="text-gray-500 text-sm w-16">${m.timeSlot||'10:00'}<br>F${m.field||1}</div>
                    <div class="flex-1 px-4 font-bold text-gray-800">${m.teamA} vs ${m.teamB}<div class="text-xs text-blue-500 font-normal">${m.division}</div></div>
                    <div>${m.status==='finished' ? `<span class="bg-green-100 px-2 py-1 rounded">${m.scoreA}-${m.scoreB}</span>` : `<span class="bg-gray-100 px-2 py-1 text-xs rounded">Upcoming</span>`}</div>
                `;
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
