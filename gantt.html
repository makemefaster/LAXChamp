<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Gantt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gantt-grid {
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
            background-size: 60px 100%; /* 60px = 15 mins (4px per min) */
        }
        .match-block {
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: grab;
            user-select: none;
        }
        .match-block:active {
            cursor: grabbing;
            z-index: 50;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        .pitch-row { border-bottom: 1px solid #e2e8f0; position: relative; height: 80px; }
        .time-marker { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #cbd5e1; font-size: 10px; color: #64748b; padding-left: 4px; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden font-sans">

    <div class="bg-white border-b border-slate-200 p-4 shrink-0 flex justify-between items-center shadow-sm z-20">
        <div>
            <h1 class="font-black text-lg text-slate-900 flex items-center gap-2">
                <a href="director.html" class="text-slate-300 hover:text-indigo-600">←</a>
                Scheduler (Gantt)
            </h1>
            <p class="text-xs text-slate-400">Drag matches to move them. <span id="status" class="text-indigo-500 font-bold">Connecting...</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="zoom(-1)" class="bg-slate-100 px-3 py-1 rounded font-bold hover:bg-slate-200">-</button>
            <button onclick="zoom(1)" class="bg-slate-100 px-3 py-1 rounded font-bold hover:bg-slate-200">+</button>
        </div>
    </div>

    <div class="flex-1 overflow-auto relative custom-scroll" id="scrollArea">
        
        <div class="flex">
            <div class="w-24 shrink-0 bg-white border-r border-slate-200 sticky left-0 z-10 shadow-lg" id="pitchLabels">
                </div>

            <div class="relative min-w-[2000px] gantt-grid bg-white" id="ganttBoard">
                </div>
        </div>

    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-80">
            <h3 class="font-bold text-lg mb-4">Edit Match</h3>
            <div class="space-y-3">
                <input type="time" id="editTime" class="w-full p-2 border rounded font-bold">
                <select id="editPitch" class="w-full p-2 border rounded font-bold"></select>
                <div class="flex gap-2 pt-2">
                    <button onclick="saveEdit()" class="flex-1 bg-indigo-600 text-white font-bold py-2 rounded">Save</button>
                    <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "<div class='p-10'>No Event ID</div>";

        // CONFIG
        let PX_PER_MIN = 4; // Zoom level
        const ROW_HEIGHT = 80;
        const START_HOUR = 8; // 08:00 AM start of chart

        let matches = [];
        let editingKey = null;

        // 1. LOAD DATA
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const board = document.getElementById('ganttBoard');
            const labelCol = document.getElementById('pitchLabels');
            const status = document.getElementById('status');
            
            if(!snap.exists()) {
                status.innerText = "0 Matches";
                board.innerHTML = "";
                return;
            }

            matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            status.innerText = `${matches.length} Matches Loaded`;

            renderBoard();
        });

        // 2. RENDER BOARD
        function renderBoard() {
            const board = document.getElementById('ganttBoard');
            const labelCol = document.getElementById('pitchLabels');
            
            board.innerHTML = '';
            labelCol.innerHTML = '';

            // A. Determine Dimensions
            const maxPitch = Math.max(...matches.map(m => m.field || 1), 3); // At least 3 pitches
            
            // B. Draw Pitch Rows
            for(let p=1; p<=maxPitch; p++) {
                // Label
                const label = document.createElement('div');
                label.className = `h-[${ROW_HEIGHT}px] border-b border-slate-200 flex items-center justify-center font-black text-slate-400 uppercase bg-slate-50`;
                label.style.height = `${ROW_HEIGHT}px`;
                label.innerText = `Pitch ${p}`;
                labelCol.appendChild(label);

                // Row Lines (Visual only)
                const row = document.createElement('div');
                row.className = "pitch-row w-full absolute";
                row.style.top = `${(p-1) * ROW_HEIGHT}px`;
                row.style.height = `${ROW_HEIGHT}px`;
                board.appendChild(row);
            }

            // C. Draw Time Markers (every 30 mins)
            for(let h=START_HOUR; h<20; h++) {
                drawMarker(h, 0, `${h}:00`);
                drawMarker(h, 30, `${h}:30`);
            }

            // D. Draw Matches
            matches.forEach(m => {
                const el = document.createElement('div');
                
                // Position Math
                const [h, min] = (m.timeSlot || "09:00").split(':').map(Number);
                const totalMins = (h - START_HOUR) * 60 + min;
                const left = totalMins * PX_PER_MIN;
                const top = ((m.field || 1) - 1) * ROW_HEIGHT + 10; // +10 for padding
                const width = 60 * PX_PER_MIN; // Assumed 15 min game + break? No, let's use fixed width or duration
                // Assuming 20 mins visual width for simplicity unless we calc duration
                
                el.className = `match-block absolute h-[60px] w-[160px] bg-white border border-indigo-200 rounded-lg shadow-sm p-2 flex flex-col justify-center text-xs overflow-hidden`;
                if(m.status === 'live') el.className += " border-green-500 ring-2 ring-green-100";
                
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
                el.style.width = `${(15+5) * PX_PER_MIN}px`; // Approx 20 mins width

                el.innerHTML = `
                    <div class="font-bold text-indigo-600 truncate">${m.timeSlot}</div>
                    <div class="font-bold text-slate-700 truncate">${m.teamA}</div>
                    <div class="font-bold text-slate-700 truncate">${m.teamB}</div>
                `;

                // INTERACTIVITY
                el.draggable = true;
                el.ondragstart = (e) => handleDragStart(e, m);
                el.ondblclick = () => openEdit(m);

                board.appendChild(el);
            });
        }

        function drawMarker(h, m, text) {
            const totalMins = (h - START_HOUR) * 60 + m;
            const left = totalMins * PX_PER_MIN;
            const marker = document.createElement('div');
            marker.className = "absolute top-0 bottom-0 border-l border-slate-200 text-[10px] text-slate-400 pl-1 pt-1";
            marker.style.left = `${left}px`;
            marker.innerText = text;
            document.getElementById('ganttBoard').appendChild(marker);
        }

        // 3. DRAG & DROP LOGIC
        let draggedMatch = null;

        function handleDragStart(e, match) {
            draggedMatch = match;
            e.dataTransfer.effectAllowed = 'move';
            // slight transparency
            e.target.style.opacity = '0.5';
        }

        // Allow dropping on the board
        const board = document.getElementById('ganttBoard');
        
        board.ondragover = (e) => {
            e.preventDefault(); // Necessary to allow dropping
        };

        board.ondrop = (e) => {
            e.preventDefault();
            if(!draggedMatch) return;

            const rect = board.getBoundingClientRect();
            const x = e.clientX - rect.left + board.parentElement.scrollLeft;
            const y = e.clientY - rect.top + board.parentElement.scrollTop;

            // Calc new Time
            const totalMins = Math.round(x / PX_PER_MIN);
            const newHour = Math.floor(totalMins / 60) + START_HOUR;
            const newMin = totalMins % 60;
            // Round to nearest 5 mins
            const roundedMin = Math.round(newMin / 5) * 5;
            const timeString = `${String(newHour).padStart(2,'0')}:${String(roundedMin).padStart(2,'0')}`;

            // Calc new Pitch
            const pitchIndex = Math.floor(y / ROW_HEIGHT);
            const newPitch = pitchIndex + 1;

            if(newPitch < 1) return;

            // UPDATE DB
            update(ref(db, `tournaments/${eventId}/schedule/${draggedMatch.key}`), {
                timeSlot: timeString,
                field: newPitch
            });
            
            draggedMatch = null;
        };
        
        // 4. ZOOM
        window.zoom = (dir) => {
            PX_PER_MIN = Math.max(1, Math.min(10, PX_PER_MIN + dir));
            renderBoard();
        };

        // 5. MANUAL EDIT (Double Click)
        window.openEdit = (m) => {
            editingKey = m.key;
            document.getElementById('editTime').value = m.timeSlot;
            
            const pitchSel = document.getElementById('editPitch');
            pitchSel.innerHTML = '';
            for(let i=1; i<=6; i++) pitchSel.innerHTML += `<option value="${i}">Pitch ${i}</option>`;
            pitchSel.value = m.field;

            document.getElementById('editModal').classList.remove('hidden');
        };

        window.saveEdit = () => {
            const t = document.getElementById('editTime').value;
            const p = parseInt(document.getElementById('editPitch').value);
            update(ref(db, `tournaments/${eventId}/schedule/${editingKey}`), { timeSlot: t, field: p });
            closeModal();
        };

        window.closeModal = () => document.getElementById('editModal').classList.add('hidden');

    </script>
</body>
</html>
