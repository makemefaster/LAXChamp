<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn { border-bottom: 2px solid transparent; opacity: 0.6; }
        .tab-btn.active { border-color: #4f46e5; opacity: 1; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10 font-sans">

    <div id="alertBanner" class="hidden fixed top-0 left-0 right-0 z-50 p-4 shadow-xl transform transition-transform duration-300 translate-y-0">
        <div class="max-w-md mx-auto flex items-start gap-3">
            <div id="alertIcon" class="text-2xl">📢</div>
            <div>
                <h3 id="alertTitle" class="font-bold uppercase text-xs tracking-wider opacity-80 mb-1">Tournament Announcement</h3>
                <p id="alertText" class="font-bold text-sm leading-tight"></p>
            </div>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-6 text-center shadow-lg pt-8">
        <h1 id="eventTitle" class="text-2xl font-black tracking-tight">Loading Event...</h1>
        <p class="text-slate-400 text-sm mt-1">Official Results Center</p>
    </div>

    <div class="flex bg-white shadow-sm sticky top-0 z-40 text-sm uppercase tracking-wider text-slate-500">
        <button onclick="switchTab('matches')" id="tab-matches" class="tab-btn active flex-1 py-4 text-center">Matches</button>
        <button onclick="switchTab('standings')" id="tab-standings" class="tab-btn flex-1 py-4 text-center">Standings</button>
    </div>

    <div class="max-w-md mx-auto p-4">

        <div id="view-matches" class="space-y-3">
            <div class="text-center py-10 text-slate-400">Loading schedule...</div>
        </div>

        <div id="view-standings" class="hidden space-y-6">
            </div>

    </div>

    <div class="text-center mt-8 mb-4">
        <a id="umpireLink" href="#" class="text-xs font-bold text-slate-300 hover:text-indigo-500 uppercase">
            Official Login
        </a>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(!eventId) {
            document.body.innerHTML = "<div class='p-10 text-center'>No Event Selected</div>";
        } else {
            // Listener for matches
            onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
                const container = document.getElementById('view-matches');
                container.innerHTML = ''; // Clear previous matches

                if (!snap.exists()) {
                    container.innerHTML = "<div>No matches available</div>";
                    return;
                }

                snap.forEach(match => {
                    const matchData = match.val();
                    const div = document.createElement('div');
                    div.className = "bg-white border border-slate-200 rounded-lg p-3 shadow-sm";
                    div.innerHTML = `
                        <div class='flex justify-between items-center mb-2'>
                            <span class='text-sm font-bold text-indigo-500'>${matchData.timeSlot || 'TBD'} - Pitch ${matchData.field || 'N/A'}</span>
                            <span class='text-xs text-slate-400'>${matchData.division || 'Division'}</span>
                        </div>
                        <div class='text-center font-semibold'>${matchData.teamA || 'Team A'} vs ${matchData.teamB || 'Team B'}</div>
                    `;
                    container.appendChild(div);
                });
            });
        }
    </script>

</body>
</html>
