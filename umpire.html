<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire</title>
    <style>
        body{background:#111;color:white;font-family:sans-serif;text-align:center;padding:20px}
        .scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        .team-box{background:#222;padding:20px;border-radius:10px}
        .score{font-size:3rem;font-weight:bold;display:block}
        button{width:100%;padding:15px;margin:5px 0;font-size:1.1rem;border:none;border-radius:5px;cursor:pointer}
        .btn-plus{background:#28a745;color:white}
        .btn-time{background:#ffc107;color:black;font-weight:bold}
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="team-box">
            <h2 id="nameA">Home</h2>
            <span id="scoreA" class="score">0</span>
            <button class="btn-plus" onclick="modScore('A',1)">+1</button>
            <button onclick="modScore('A',-1)">Undo</button>
        </div>
        <div class="team-box">
            <h2 id="nameB">Away</h2>
            <span id="scoreB" class="score">0</span>
            <button class="btn-plus" onclick="modScore('B',1)">+1</button>
            <button onclick="modScore('B',-1)">Undo</button>
        </div>
    </div>
    <div class="team-box">
        <div id="timer" style="font-size:3rem;font-family:monospace">00:00</div>
        <button class="btn-time" onclick="toggleTimer()">Start / Stop</button>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue, update, increment } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const eventId = new URLSearchParams(window.location.search).get('event');
        if(!eventId) alert("No Event ID");
        const matchRef = ref(db, `tournaments/${eventId}/match`);
        let isRunning = false; let time = 0; let interval = null;

        onValue(matchRef, (snap) => {
            const data = snap.val();
            if(!data) return;
            document.getElementById('nameA').innerText = data.teamA;
            document.getElementById('nameB').innerText = data.teamB;
            document.getElementById('scoreA').innerText = data.scoreA;
            document.getElementById('scoreB').innerText = data.scoreB;
            time = data.time; isRunning = data.isRunning;
            renderTimer();
            if(interval) clearInterval(interval);
            if(isRunning) interval = setInterval(tick, 1000);
        });

        function tick() {
            if(time > 0) { time--; renderTimer(); if(time%5===0) update(matchRef, {time}); }
            else update(matchRef, {isRunning: false});
        }
        function renderTimer() {
            const m = Math.floor(time/60).toString().padStart(2,'0');
            const s = (time%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }
        window.modScore = (t, n) => update(matchRef, { [`score${t}`]: increment(n) });
        window.toggleTimer = () => update(matchRef, { isRunning: !isRunning });
    </script>
</body>
</html>
