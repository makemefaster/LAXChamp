<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-score { touch-action: manipulation; transition: transform 0.1s; }
        .btn-score:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <div class="w-full text-center border-b border-gray-800 pb-2 mb-2">
        <h1 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Official Umpire Interface</h1>
        <div id="statusBadge" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-gray-800 text-gray-400 mt-1">WAITING FOR GAME</div>
    </div>

    <div class="flex-1 w-full max-w-md flex flex-col justify-center gap-6">
        
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
            <h2 id="nameA" class="text-xl font-bold text-gray-300 mb-2 truncate">Home</h2>
            <div class="flex justify-between items-center">
                <button onclick="modScore('A', -1)" class="w-16 h-16 rounded-full bg-gray-800 text-gray-400 text-2xl font-bold btn-score control-btn">-</button>
                <div id="scoreA" class="text-7xl font-black text-white">0</div>
                <button onclick="modScore('A', 1)" class="w-16 h-16 rounded-full bg-blue-600 text-white text-3xl font-bold btn-score control-btn shadow-lg shadow-blue-900/50">+</button>
            </div>
        </div>

        <div class="text-center py-2">
            <div id="timerDisplay" class="text-5xl font-mono font-bold tracking-wider text-yellow-400">00:00</div>
            <button id="timerBtn" onclick="toggleTimer()" class="mt-2 text-sm text-gray-400 border border-gray-700 px-4 py-1 rounded-full control-btn">Start Clock</button>
        </div>

        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-2 h-full bg-orange-500"></div>
            <h2 id="nameB" class="text-xl font-bold text-gray-300 mb-2 truncate">Away</h2>
            <div class="flex justify-between items-center">
                <button onclick="modScore('B', -1)" class="w-16 h-16 rounded-full bg-gray-800 text-gray-400 text-2xl font-bold btn-score control-btn">-</button>
                <div id="scoreB" class="text-7xl font-black text-white">0</div>
                <button onclick="modScore('B', 1)" class="w-16 h-16 rounded-full bg-orange-600 text-white text-3xl font-bold btn-score control-btn shadow-lg shadow-orange-900/50">+</button>
            </div>
        </div>

    </div>

    <div class="w-full max-w-md mt-6 mb-4">
        <button id="finalizeBtn" onclick="finalizeMatch()" class="w-full bg-green-700 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition control-btn">
            FINALIZE MATCH ✅
        </button>
        <div id="lockedMsg" class="hidden text-center p-4 bg-gray-900 rounded-xl border border-gray-700">
            <p class="text-green-500 font-bold text-lg">MATCH COMPLETED</p>
            <p class="text-gray-500 text-xs">Scores have been submitted.</p>
        </div>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue, update, increment, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "<h1 class='text-white text-center mt-10'>No Event ID</h1>";

        const matchRef = ref(db, `tournaments/${eventId}/match`);
        let isRunning = false; 
        let time = 0; 
        let interval = null;
        let scheduleKey = null;

        // 1. SYNC WITH DB
        onValue(matchRef, (snap) => {
            const data = snap.val();
            if(!data) return;

            document.getElementById('nameA').innerText = data.teamA || 'Home';
            document.getElementById('nameB').innerText = data.teamB || 'Away
