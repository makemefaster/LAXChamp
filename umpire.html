<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl border border-orange-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Umpire Access</h1>
            <p id="eventName" class="text-orange-600 font-bold text-sm uppercase mt-1">Loading Event...</p>
        </div>

        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username (e.g. ref)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-orange-500">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-orange-500">
            <button onclick="login()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition shadow-md">Enter Field</button>
        </div>
        
        <p id="errorMsg" class="text-red-500 text-center text-sm mt-4 hidden"></p>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        // Get Event ID
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(eventId) {
            onValue(ref(db, `tournaments/${eventId}/name`), (snap) => {
                if(snap.exists()) document.getElementById('eventName').innerText = snap.val();
                else document.getElementById('eventName').innerText = "Event Not Found";
            });
        } else {
             document.getElementById('eventName').innerText = "No Event Selected";
        }

        window.login = async () => {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            
            // Fetch credentials from DB
            const snapshot = await get(ref(db, `tournaments/${eventId}/settings/umpire`));
            const creds = snapshot.val() || { user: 'ref', pass: 'whistle' }; // Defaults

            if (u === creds.user && p === creds.pass) {
                // Success!
                window.location.href = `umpire.html?event=${eventId}`;
            } else {
                err.innerText = "Invalid Username or Password";
                err.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
