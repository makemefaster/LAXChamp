<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl border border-orange-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Umpire Access</h1>
            <p id="eventName" class="text-orange-600 font-bold text-sm uppercase mt-1">Loading Event...</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="umpire@laxchamp.com" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg">
            <button onclick="login()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition">Enter Field</button>
        </div>
        <p id="errorMsg" class="text-red-500 text-center text-sm mt-4 hidden"></p>
    </div>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(eventId) {
            onValue(ref(db, `tournaments/${eventId}/name`), (snap) => {
                if(snap.exists()) document.getElementById('eventName').innerText = snap.val();
                else document.getElementById('eventName').innerText = "Event Not Found";
            });
        } else {
             document.getElementById('eventName').innerText = "No Event Selected";
        }

        window.login = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p)
                .then(() => window.location.href = `umpire.html?event=${eventId}`)
                .catch(() => {
                    document.getElementById('errorMsg').innerText = "Invalid Credentials";
                    document.getElementById('errorMsg').classList.remove('hidden');
                });
        };
    </script>
</body>
</html>
