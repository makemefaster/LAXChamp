<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pill { cursor: pointer; user-select: none; transition: all 0.2s; }
        .pill.selected { background-color: #fbbf24; border-color: #f59e0b; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24 font-sans">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center mb-2">
            <h1 class="font-bold text-lg">Event Manager</h1>
            <div id="dbStatus" class="text-xs font-mono bg-blue-900 text-blue-200 px-2 py-1 rounded">Connecting...</div>
        </div>
        <div class="flex justify-between items-center text-xs">
            <span id="matchCountDisplay">Loading...</span>
            <button onclick="forceReload()" class="text-blue-300 hover:text-white underline">Force Refresh</button>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">

        <div class="bg-white rounded-xl p-3 mb-6 border border-slate-200 shadow-sm">
            <h2 class="text-[10px] font-bold uppercase text-slate-400 mb-2">📢 Broadcast</h2>
            <div class="flex gap-2">
                <input type="text" id="alertMsg" placeholder="Alert Message..." class="flex-1 bg-slate-50 border rounded px-2 py-1 text-sm">
                <button onclick="sendAlert()" class="bg-indigo-600 text-white font-bold px-3 py-1 rounded text-xs">SEND</button>
                <button onclick="clearAlert()" class="bg-slate-200 text-slate-600 font-bold px-3 py-1 rounded text-xs">CLR</button>
            </div>
        </div>

        <div id="matchGrid" class="space-y-3"></div>

        <div id="errorLog" class="hidden mt-8 p-4 bg-red-50 text-red-600 text-xs font-mono border border-red-200 rounded"></div>

    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        let swapSource = null;

        if(!eventId) document.body.innerHTML = "<div class='p-10'>No Event ID</div>";

        // 1. ROBUST SCHEDULE LISTENER
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const container = document.getElementById('matchGrid');
            const status = document.getElementById('dbStatus');
            const countDisplay = document.getElementById('matchCountDisplay');
            container.innerHTML = '';

            if(!snap.exists()) {
                status.innerText = "DB: Empty";
                countDisplay.innerText = "0 Matches found";
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No matches in database.<br><a href="admin.html?event=${eventId}" class="text-indigo-600 underline">Run Setup</a></div>`;
                return;
            }

            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            
            // UPDATE STATUS
            status.innerText = "DB: Connected";
            status.className = "text-xs font-mono bg-green-900 text-green-200 px-2 py-1 rounded";
            countDisplay.innerText = `Showing ${matches.length} Matches`;

            // Sort by Time (FIXED: Added fallback strings to prevent crash on missing data)
            matches.sort((a,b) => ((a.timeSlot||'') + a.field).localeCompare((b.timeSlot||'') + b.field));

            matches.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg p-3 shadow-sm relative";
                
                // Division Badge Color
                const divColor = m.division?.includes('1') ? 'text-indigo-500' : 'text-orange-500';

                // FIXED: Added "|| '(Empty)'" to display a placeholder if team name is missing
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-50">
                        <div class="flex items-center gap-2">
                             <span class="text-[10px] font-black uppercase ${divColor}">${m.division || 'DIV'}</span>
                             <span class="text-xs font-bold bg-slate-100 px-2 rounded">${m.timeSlot}</span>
                             <span class="text-[10px] font-bold text-slate-400 uppercase">Pitch ${m.field}</span>
                        </div>
                        <button onclick="goLive('${m.key}')" class="text-[10px] font-bold bg-green-50 text-green-600 px-2 py-1 rounded border border-green-200">LIVE</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <div onclick="swap('${m.key}','teamA','${m.teamA}')" class="pill flex-1 bg-slate-50 border p-2 text-center text-sm font-bold truncate rounded">${m.teamA || '(Empty)'}</div>
                        <div class="text-xs text-slate-300">vs</div>
                        <div onclick="swap('${m.key}','teamB','${m.teamB}')" class="pill flex-1 bg-slate-50 border p-2 text-center text-sm font-bold truncate rounded">${m.teamB || '(Empty)'}</div>
                    </div>
                `;
                container.appendChild(card);
            });

        }, (error) => {
            document.getElementById('errorLog').innerText = error.message;
            document.getElementById('errorLog').classList.remove('hidden');
        });

        // --- BROADCAST ---
        window.sendAlert = () => {
            const msg = document.getElementById('alertMsg').value;
            if(msg) set(ref(db, `tournaments/${eventId}/alert`), { message: msg, type: 'info' });
        };
        window.clearAlert = () => set(ref(db, `tournaments/${eventId}/alert`), null);

        // --- SWAP LOGIC ---
        window.swap = (key, field, name) => {
            // Treat "undefined" or "null" name as empty string for clarity in alerts
            const displayName = name || "(Empty Slot)";
            
            if(!swapSource) {
                swapSource = { key, field, name };
                alert(`Selected ${displayName}. Tap another team to swap.`);
            } else {
                const updates = {};
                updates[`tournaments/${eventId}/schedule/${swapSource.key}/${swapSource.field}`] = name;
                updates[`tournaments/${eventId}/schedule/${key}/${field}`] = swapSource.name;
                update(ref(db), updates);
                swapSource = null;
            }
        };

        window.goLive = (key) => {
            get(ref(db, `tournaments/${eventId}/schedule/${key}`)).then(s => {
                const m = s.val();
                update(ref(db, `tournaments/${eventId}/match`), { 
                    teamA: m.teamA || 'Home', teamB: m.teamB || 'Away', scoreA: m.scoreA, scoreB: m.scoreB, 
                    isRunning: false, scheduleKey: key 
                });
                update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
            });
        };

        window.forceReload = () => window.location.reload();
    </script>
</body>
</html>
