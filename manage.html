<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.pill.selected { background-color: #fbbf24; border-color: #d97706; transform: scale(1.05); font-weight:bold; }</style>
</head>
<body class="bg-slate-100 min-h-screen pb-24">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <a href="director.html" class="text-slate-400 hover:text-white">←</a>
            <h1 class="font-bold text-lg">Event Manager</h1>
        </div>
        <div id="swapStatus" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded border border-slate-700 text-yellow-500">Tap team to swap</div>
    </div>

    <div class="max-w-md mx-auto p-4">
        
        <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-[10px] font-bold uppercase text-slate-400">Live Scoreboard</h2>
                <button onclick="stopGame()" class="text-[10px] text-red-500 font-bold border border-red-100 px-2 py-1 rounded hover:bg-red-50">RESET</button>
            </div>
            <div class="flex items-center justify-center gap-4 bg-slate-50 p-4 rounded border">
                <div class="text-center w-1/3"><div id="liveHome" class="font-black truncate">--</div><div id="liveScoreA" class="text-blue-600 font-bold text-2xl">0</div></div>
                <div class="text-xs font-black text-slate-300">VS</div>
                <div class="text-center w-1/3"><div id="liveAway" class="font-black truncate">--</div><div id="liveScoreB" class="text-blue-600 font-bold text-2xl">0</div></div>
            </div>
        </div>

        <div id="matchGrid" class="space-y-3">
            <div class="text-center py-10 opacity-50">Loading matches...</div>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        let swapSource = null;

        if(!eventId) window.location.href = 'director.html';
        onAuthStateChanged(auth, u => { if(!u) window.location.href='director.html'; });

        // Live Score
        onValue(ref(db, `tournaments/${eventId}/match`), s => {
            const m = s.val() || { teamA:'--', teamB:'--', scoreA:0, scoreB:0 };
            document.getElementById('liveHome').innerText = m.teamA;
            document.getElementById('liveAway').innerText = m.teamB;
            document.getElementById('liveScoreA').innerText = m.scoreA;
            document.getElementById('liveScoreB').innerText = m.scoreB;
        });

        // Schedule
        onValue(ref(db, `tournaments/${eventId}/schedule`), snap => {
            const container = document.getElementById('matchGrid');
            container.innerHTML = '';
            
            if(!snap.exists()) {
                container.innerHTML = `<div class="text-center py-10"><p>No schedule found.</p><a href="admin.html?event=${eventId}" class="text-blue-600 underline">Run Setup</a></div>`;
                return;
            }

            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            matches.sort((a,b) => (a.timeSlot + a.field).localeCompare(b.timeSlot + b.field));

            matches.forEach(m => {
                const isSelA = swapSource?.key===m.key && swapSource?.field==='teamA';
                const isSelB = swapSource?.key===m.key && swapSource?.field==='teamB';
                
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg p-3 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-50">
                        <div class="flex gap-2 text-xs">
                            <input type="time" value="${m.timeSlot}" onchange="upd('${m.key}','timeSlot',this.value)" class="bg-slate-100 rounded px-1 w-20">
                            <span class="bg-slate-100 px-2 rounded font-bold pt-1">P${m.field}</span>
                            <span class="text-slate-400 pt-1 uppercase font-bold text-[10px]">${m.division}</span>
                        </div>
                        <button onclick="goLive('${m.key}')" class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold">GO LIVE</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <div onclick="swap('${m.key}','teamA','${m.teamA}')" class="pill ${isSelA?'selected':''} flex-1 bg-slate-50 border rounded p-2 text-center text-sm font-bold truncate transition">${m.teamA}</div>
                        <div class="text-xs text-slate-400">vs</div>
                        <div onclick="swap('${m.key}','teamB','${m.teamB}')" class="pill ${isSelB?'selected':''} flex-1 bg-slate-50 border rounded p-2 text-center text-sm font-bold truncate transition">${m.teamB}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        window.swap = (key, field, name) => {
            if(!swapSource) {
                swapSource = { key, field, name };
                document.getElementById('swapStatus').innerText = `Selected: ${name}`;
                document.getElementById('swapStatus').classList.add('bg-yellow-100');
                // Force re-render via listener (read once)
                get(ref(db, `tournaments/${eventId}/schedule`));
            } else {
                if(swapSource.key === key && swapSource.field === field) {
                    swapSource = null; // Cancel
                } else {
                    const updates = {};
                    updates[`tournaments/${eventId}/schedule/${swapSource.key}/${swapSource.field}`] = name;
                    updates[`tournaments/${eventId}/schedule/${key}/${field}`] = swapSource.name;
                    update(ref(db), updates);
                    swapSource = null;
                }
                document.getElementById('swapStatus').innerText = "Tap team to swap";
                document.getElementById('swapStatus').classList.remove('bg-yellow-100');
            }
        };

        window.upd = (k, f, v) => update(ref(db, `tournaments/${eventId}/schedule/${k}`), {[f]:v});
        window.goLive = async (k) => {
            const s = await get(ref(db, `tournaments/${eventId}/schedule/${k}`));
            const m = s.val();
            update(ref(db, `tournaments/${eventId}/match`), { teamA:m.teamA, teamB:m.teamB, scoreA:m.scoreA, scoreB:m.scoreB, scheduleKey:k, isRunning:false });
            update(ref(db, `tournaments/${eventId}/schedule/${k}`), { status:'live' });
        };
        window.stopGame = () => update(ref(db, `tournaments/${eventId}/match`), { teamA:'--', teamB:'--', isRunning:false });
    </script>
</body>
</html>
