<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="director.html" class="text-slate-400 hover:text-white transition">← Dashboard</a>
            <h1 id="eventName" class="font-bold text-lg hidden md:block">Loading...</h1>
        </div>
        <div class="flex gap-2">
            <a href="#" id="publicLink" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-sm font-bold">Public Page</a>
            <button onclick="showUmpireModal()" class="bg-orange-600 hover:bg-orange-500 px-3 py-1.5 rounded text-sm font-bold">Umpire Settings</button>
        </div>
    </div>

    <div id="umpireModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full text-slate-800">
            <h2 class="text-xl font-bold mb-4">Umpire Access</h2>
            <p class="text-xs text-slate-500 mb-4">Set the login details for your referees.</p>
            
            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Umpire Username</label>
                    <input type="text" id="umpUser" class="w-full p-2 border rounded bg-slate-50 font-mono text-sm" placeholder="e.g. ref">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase">Umpire Password</label>
                    <input type="text" id="umpPass" class="w-full p-2 border rounded bg-slate-50 font-mono text-sm" placeholder="e.g. whistle">
                </div>
            </div>
            
            <button onclick="saveUmpireCreds()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded mb-2">Save Credentials</button>
            <button onclick="copyUmpireInfo()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded mb-2">Copy Invite for Refs</button>
            <button onclick="document.getElementById('umpireModal').classList.add('hidden')" class="w-full text-slate-400 text-sm">Close</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="md:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-slate-500 text-xs font-bold uppercase mb-4">Live Scoreboard</h2>
                <div class="flex items-center justify-between bg-slate-50 p-4 rounded-lg border border-slate-100">
                    <div class="text-center flex-1">
                        <div id="liveHome" class="font-black text-xl md:text-2xl text-slate-800">--</div>
                        <div id="liveScoreA" class="text-indigo-600 font-bold text-lg">0</div>
                    </div>
                    <div class="px-4 text-slate-300 font-bold">VS</div>
                    <div class="text-center flex-1">
                        <div id="liveAway" class="font-black text-xl md:text-2xl text-slate-800">--</div>
                        <div id="liveScoreB" class="text-indigo-600 font-bold text-lg">0</div>
                    </div>
                </div>
                <div class="mt-4 text-right">
                    <button onclick="stopGame()" class="text-xs text-red-500 hover:underline">Clear Active Game</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-slate-500 text-xs font-bold uppercase mb-2">Venue Map</h2>
                    <p class="text-xs text-slate-400 mb-4">Upload venue layout.</p>
                </div>
                <input type="file" id="mapInput" accept="image/*" class="text-xs block w-full text-slate-500">
                <button onclick="uploadMap()" id="mapBtn" class="mt-2 w-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2 rounded">Update Map</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-700">Master Schedule</h2>
                <button onclick="addMatch()" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-2 rounded font-bold">+ Add Match</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-bold">
                        <tr>
                            <th class="p-4">Time</th>
                            <th class="p-4">Field</th>
                            <th class="p-4">Home</th>
                            <th class="p-4">Away</th>
                            <th class="p-4">Score</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(!eventId) window.location.href = 'director.html';

        onAuthStateChanged(auth, (user) => {
            if(!user) window.location.href = 'director.html';
            
            const baseUrl = window.location.origin + window.location.pathname.replace('manage.html', '');
            document.getElementById('publicLink').href = `${baseUrl}index.html?event=${eventId}`;
            
            onValue(ref(db, `tournaments/${eventId}/name`), s => {
                document.getElementById('eventName').innerText = s.val() || "Event Manager";
            });

            // Load Existing Umpire Creds
            onValue(ref(db, `tournaments/${eventId}/settings/umpire`), s => {
                const creds = s.val() || { user: 'ref', pass: 'whistle' };
                document.getElementById('umpUser').value = creds.user;
                document.getElementById('umpPass').value = creds.pass;
            });
        });

        // Load Schedule & Live Match
        onValue(ref(db, `tournaments/${eventId}/match`), s => {
            const m = s.val();
            if(m) {
                document.getElementById('liveHome').innerText = m.teamA;
                document.getElementById('liveAway').innerText = m.teamB;
                document.getElementById('liveScoreA').innerText = m.scoreA;
                document.getElementById('liveScoreB').innerText = m.scoreB;
            }
        });

        onValue(ref(db, `tournaments/${eventId}/schedule`), snap => {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            matches.sort((a,b) => (a.timeSlot || '0').localeCompare(b.timeSlot || '0'));

            matches.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3"><input class="w-16 bg-slate-100 rounded p-1 text-center" value="${m.timeSlot || ''}" onchange="updateMatch('${m.key}','timeSlot',this.value)"></td>
                    <td class="p-3"><input class="w-12 bg-slate-100 rounded p-1 text-center" value="${m.field || ''}" onchange="updateMatch('${m.key}','field',this.value)"></td>
                    <td class="p-3"><input class="w-28 bg-slate-100 rounded p-1 font-bold" value="${m.teamA}" onchange="updateMatch('${m.key}','teamA',this.value)"></td>
                    <td class="p-3"><input class="w-28 bg-slate-100 rounded p-1 font-bold" value="${m.teamB}" onchange="updateMatch('${m.key}','teamB',this.value)"></td>
                    <td class="p-3 flex items-center gap-1">
                        <input class="w-8 bg-white border rounded p-1 text-center" value="${m.scoreA||0}" onchange="updateMatch('${m.key}','scoreA',Number(this.value))">
                        -
                        <input class="w-8 bg-white border rounded p-1 text-center" value="${m.scoreB||0}" onchange="updateMatch('${m.key}','scoreB',Number(this.value))">
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="goLive('${m.key}')" class="text-indigo-600 font-bold text-xs mr-2">📺 Live</button>
                        <button onclick="deleteMatch('${m.key}')" class="text-red-400 font-bold text-xs">×</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.updateMatch = (key, field, val) => update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val });
        window.addMatch = () => { push(ref(db, `tournaments/${eventId}/schedule`), { timeSlot: "12:00", field: 1, teamA: "Team A", teamB: "Team B", scoreA: 0, scoreB: 0, status: "scheduled" }); };
        window.deleteMatch = (key) => { if(confirm("Delete?")) set(ref(db, `tournaments/${eventId}/schedule/${key}`), null); };
        window.goLive = async (key) => {
            const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
            const m = snap.val();
            if(m) {
                update(ref(db, `tournaments/${eventId}/match`), { teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB, time: 1200, isRunning: false, scheduleKey: key });
                update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
            }
        };
        window.stopGame = () => update(ref(db, `tournaments/${eventId}/match`), { isRunning: false, teamA: "Paused", teamB: "Paused" });
        window.uploadMap = () => {
            const file = document.getElementById('mapInput').files[0];
            if(!file) return alert("Select file");
            const btn = document.getElementById('mapBtn');
            btn.innerText = "Uploading...";
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); canvas.width = 800; canvas.height = img.height*(800/img.width);
                    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                    set(ref(db, `tournaments/${eventId}/venue/mapImage`), canvas.toDataURL('image/jpeg', 0.7)).then(() => btn.innerText = "Done!");
                };
            };
        };
        
        window.showUmpireModal = () => document.getElementById('umpireModal').classList.remove('hidden');
        
        // SAVE CREDENTIALS TO DB
        window.saveUmpireCreds = () => {
            const user = document.getElementById('umpUser').value;
            const pass = document.getElementById('umpPass').value;
            if(!user || !pass) return alert("Enter both username and password");
            set(ref(db, `tournaments/${eventId}/settings/umpire`), { user, pass })
                .then(() => alert("Saved! Umpires can now use these details."));
        };

        window.copyUmpireInfo = () => {
            const user = document.getElementById('umpUser').value;
            const pass = document.getElementById('umpPass').value;
            const link = `${window.location.origin}${window.location.pathname.replace('manage.html', '')}umpire-login.html?event=${eventId}`;
            const text = `Official Umpire Access:\nLink: ${link}\nUsername: ${user}\nPassword: ${pass}`;
            navigator.clipboard.writeText(text);
            alert("Invitation copied to clipboard!");
        };
    </script>
</body>
</html>
