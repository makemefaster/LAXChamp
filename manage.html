<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager (Phase 6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .saved-flash { animation: flash 1s ease-out; }
        @keyframes flash { 0% { background-color: #bbf7d0; } 100% { background-color: white; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <div class="bg-indigo-900 text-white p-4 rounded-xl mb-4 flex justify-between items-center shadow-lg sticky top-0 z-20">
        <div>
            <h1 class="font-bold text-lg">Director Mode</h1>
            <p class="text-xs text-indigo-300">Authenticated & Crash Proof</p>
        </div>
        <div id="statusTag" class="text-xs bg-indigo-800 px-3 py-1 rounded-full font-bold">Checking Auth...</div>
    </div>

    <div id="updateLog" class="fixed top-20 right-4 z-50 pointer-events-none"></div>

    <div id="matchList" class="space-y-3 max-w-xl mx-auto pb-20"></div>

    <button onclick="addMatch()" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-2xl text-3xl flex items-center justify-center hover:bg-indigo-500 z-50 active:scale-95 transition">+</button>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "No Event ID";

        // 1. AUTH CHECK (The Fix for Permission Denied)
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => {
            const status = document.getElementById('statusTag');
            if (user) {
                status.innerText = "Logged In";
                status.className = "text-xs bg-green-600 px-3 py-1 rounded-full font-bold";
            } else {
                // If not logged in, go back to start
                window.location.href = "director.html"; 
            }
        });

        const showToast = (msg, isError = false) => {
            const log = document.getElementById('updateLog');
            const el = document.createElement('div');
            el.className = `${isError ? 'bg-red-600' : 'bg-green-600'} text-white text-xs font-bold px-3 py-2 rounded shadow-lg mb-2`;
            el.innerText = msg;
            log.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        };

        // 2. LISTEN
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const list = document.getElementById('matchList');
            
            list.innerHTML = ''; 

            if(!snap.exists()) {
                list.innerHTML = `<div class="text-center text-slate-400 mt-10">No matches found.</div>`;
                return;
            }

            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));

            // 3. RENDER (With Crash Protection)
            matches.forEach((m, i) => {
                try {
                    // Time Sanitization
                    let cleanTime = m.timeSlot || "";
                    if (cleanTime.length === 4) cleanTime = "0" + cleanTime;

                    const card = document.createElement('div');
                    card.id = `card-${m.key}`;
                    card.className = `bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative`;
                    if(m.status === 'live') card.className += " border-green-500 ring-2 ring-green-100";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4 border-b border-slate-50 pb-2">
                            <div class="flex gap-2 items-center">
                                <span class="text-xs text-slate-300 font-mono">#${i+1}</span>
                                <input type="time" value="${cleanTime}" onchange="edit('${m.key}', 'timeSlot', this.value)" 
                                    class="bg-slate-100 font-bold text-sm px-2 py-1 rounded w-28 outline-none focus:ring-2 ring-indigo-500 cursor-pointer">
                                
                                <div class="flex items-center bg-slate-100 px-2 py-1 rounded">
                                    <span class="text-[10px] font-bold text-slate-400 mr-1">P</span>
                                    <input type="number" value="${m.field || 1}" onchange="edit('${m.key}', 'field', Number(this.value))" 
                                    class="bg-transparent w-4 text-center text-sm font-bold outline-none">
                                </div>
                            </div>
                            <div class="flex gap-1">
                                ${m.status === 'live' 
                                    ? `<button onclick="stopGame('${m.key}')" class="bg-green-100 text-green-700 px-3 py-1 rounded text-[10px] font-bold animate-pulse">ON AIR</button>`
                                    : `<button onclick="goLive('${m.key}')" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded text-[10px] font-bold border border-indigo-100">GO LIVE</button>`
                                }
                                <button onclick="del('${m.key}')" class="text-slate-300 hover:text-red-500 px-2 text-lg">×</button>
                            </div>
                        </div>

                        <div class="flex justify-between items-center font-bold text-slate-700 text-lg">
                            <input type="text" value="${m.teamA}" onchange="edit('${m.key}', 'teamA', this.value)" 
                                class="w-1/3 bg-transparent outline-none border-b border-transparent focus:border-indigo-500 placeholder-slate-300" placeholder="Team A">
                            
                            <div class="flex gap-1 items-center">
                                <input type="number" value="${m.scoreA}" onchange="edit('${m.key}','scoreA',Number(this.value))" 
                                    class="w-10 text-center bg-slate-50 rounded text-sm py-1 outline-none focus:ring-1 ring-indigo-500">
                                <span class="text-slate-300 text-xs">-</span>
                                <input type="number" value="${m.scoreB}" onchange="edit('${m.key}','scoreB',Number(this.value))" 
                                    class="w-10 text-center bg-slate-50 rounded text-sm py-1 outline-none focus:ring-1 ring-indigo-500">
                            </div>

                            <input type="text" value="${m.teamB}" onchange="edit('${m.key}', 'teamB', this.value)" 
                                class="w-1/3 text-right bg-transparent outline-none border-b border-transparent focus:border-indigo-500 placeholder-slate-300" placeholder="Team B">
                        </div>
                    `;
                    list.appendChild(card);
                } catch(err) {
                    console.error("Match render error", err);
                    // Skip bad match, continue loop
                }
            });
        });

        // ACTIONS
        window.edit = (key, field, val) => {
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val })
                .then(() => showToast("Saved"))
                .catch(e => {
                    console.error(e);
                    showToast("Permission Denied: Are you logged in?", true);
                });
        };

        window.del = (key) => { if(confirm("Delete this match?")) set(ref(db, `tournaments/${eventId}/schedule/${key}`), null); };
        
        window.addMatch = () => push(ref(db, `tournaments/${eventId}/schedule`), { 
            timeSlot: "09:00", field: 1, teamA: "Team A", teamB: "Team B", scoreA: 0, scoreB: 0 
        });

        window.goLive = async (key) => {
            try {
                const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
                const m = snap.val();
                await update(ref(db, `tournaments/${eventId}/match`), {
                    teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB,
                    time: 1200, isRunning: false, scheduleKey: key, division: m.division || '', isFinal: false
                });
                await update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
                showToast("Live on Scoreboard!");
            } catch(e) {
                showToast("Error going live", true);
            }
        };

        window.stopGame = (key) => {
            if(confirm("Stop Broadcasting?")) {
                update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'finished' });
                update(ref(db, `tournaments/${eventId}/match`), { isRunning: false });
            }
        }
    </script>
</body>
</html>
