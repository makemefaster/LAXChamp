<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pill { cursor: pointer; user-select: none; transition: all 0.2s; }
        .pill:hover { transform: scale(1.02); filter: brightness(95%); }
        .pill.selected { 
            background-color: #fbbf24 !important; 
            color: black !important; 
            border-color: #f59e0b !important; 
            transform: scale(1.05); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            font-weight: 900;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <a href="director.html" class="text-slate-400 hover:text-white">←</a>
            <h1 class="font-bold text-lg hidden md:block">Event Manager</h1>
            <select id="pitchFilter" onchange="renderSchedule()" class="bg-slate-800 text-xs border border-slate-700 rounded px-2 py-1 text-white">
                <option value="all">All Pitches</option>
                <option value="1">Pitch 1</option>
                <option value="2">Pitch 2</option>
                <option value="3">Pitch 3</option>
                <option value="4">Pitch 4</option>
            </select>
        </div>
        <div class="text-xs font-mono bg-slate-800 px-3 py-1 rounded border border-slate-700 text-yellow-500 truncate max-w-[150px]" id="swapStatus">
            Tap team to swap
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">

        <div class="bg-slate-800 rounded-xl p-4 mb-6 border border-slate-700 shadow-lg">
            <h2 class="text-[10px] font-bold uppercase text-slate-400 mb-2 tracking-wider">📢 Live Broadcast System</h2>
            <div class="flex gap-2 mb-2">
                <input type="text" id="alertMsg" placeholder="e.g. ⚡ Play suspended due to lightning" 
                    class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <select id="alertType" class="bg-slate-900 border border-slate-600 rounded px-2 text-sm text-white">
                    <option value="info">Info (Blue)</option>
                    <option value="warn">Delay (Yellow)</option>
                    <option value="danger">Stop (Red)</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button onclick="sendAlert()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded text-xs transition">
                    BROADCAST TO ALL
                </button>
                <button onclick="clearAlert()" class="px-4 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 rounded text-xs transition">
                    CLEAR
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Live Scoreboard</h2>
                <button onclick="stopGame()" class="text-[10px] text-red-500 font-bold border border-red-100 px-2 py-1 rounded hover:bg-red-50">RESET BOARD</button>
            </div>
            <div class="flex items-center justify-center gap-4 bg-slate-50 p-4 rounded border">
                <div class="text-center w-1/3">
                    <div id="liveHome" class="font-black text-lg truncate">--</div>
                    <div id="liveScoreA" class="text-indigo-600 font-bold text-2xl">0</div>
                </div>
                <div class="text-slate-300 font-black text-xs">VS</div>
                <div class="text-center w-1/3">
                    <div id="liveAway" class="font-black text-lg truncate">--</div>
                    <div id="liveScoreB" class="text-indigo-600 font-bold text-2xl">0</div>
                </div>
            </div>
        </div>

        <div id="matchGrid" class="space-y-3">
            <div class="text-center text-slate-400 py-10 animate-pulse">Loading schedule...</div>
        </div>

    </div>

    <button onclick="addMatch()" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-xl text-3xl flex items-center justify-center hover:bg-indigo-500 z-50 active:scale-90 transition">+</button>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(!eventId) window.location.href = 'director.html';
        onAuthStateChanged(auth, u => { if(!u) window.location.href='director.html'; });

        // GLOBAL STATE
        let swapSource = null; 
        let allMatches = []; // Store data here so we can filter locally

        // --- BROADCAST SYSTEM ---
        window.sendAlert = () => {
            const msg = document.getElementById('alertMsg').value;
            const type = document.getElementById('alertType').value;
            if(!msg) return alert("Enter a message first");
            
            // Save to DB
            set(ref(db, `tournaments/${eventId}/alert`), {
                message: msg,
                type: type,
                timestamp: Date.now()
            }).then(() => alert("Message Broadcasted Live!"));
        };

        window.clearAlert = () => {
            set(ref(db, `tournaments/${eventId}/alert`), null)
            .then(() => {
                document.getElementById('alertMsg').value = '';
                alert("Broadcast Cleared");
            });
        };

        // 1. Live Score Listener
        onValue(ref(db, `tournaments/${eventId}/match`), s => {
            const m = s.val();
            if(m) {
                document.getElementById('liveHome').innerText = m.teamA;
                document.getElementById('liveAway').innerText = m.teamB;
                document.getElementById('liveScoreA').innerText = m.scoreA;
                document.getElementById('liveScoreB').innerText = m.scoreB;
            }
        });

        // 2. Schedule Listener
        onValue(ref(db, `tournaments/${eventId}/schedule`), snap => {
            if(!snap.exists()) {
                document.getElementById('matchGrid').innerHTML = `<div class="text-center py-8 opacity-50"><p>No matches found.</p><a href="admin.html?event=${eventId}" class="text-indigo-600 underline">Run Setup Wizard</a></div>`;
                return;
            }

            allMatches = [];
            snap.forEach(c => allMatches.push({key: c.key, ...c.val()}));
            
            // Sort by Time -> Pitch -> Division
            allMatches.sort((a,b) => {
                const timeA = a.timeSlot || '99:99';
                const timeB = b.timeSlot || '99:99';
                if(timeA !== timeB) return timeA.localeCompare(timeB);
                return (a.field || 0) - (b.field || 0);
            });

            // Initial Render
            renderSchedule();
        });

        // 3. RENDER FUNCTION (Handles Filter & UI)
        window.renderSchedule = () => {
            const container = document.getElementById('matchGrid');
            const filterVal = document.getElementById('pitchFilter').value;
            container.innerHTML = '';

            allMatches.forEach(m => {
                if (filterVal !== 'all' && String(m.field) !== filterVal) return;

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg p-3 shadow-sm relative";
                
                const isSelectedA = swapSource && swapSource.key === m.key && swapSource.field === 'teamA';
                const isSelectedB = swapSource && swapSource.key === m.key && swapSource.field === 'teamB';
                const divName = m.division || 'Unknown';
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-50">
                        <div class="flex flex-col gap-1">
                            <span class="text-[10px] font-black uppercase text-slate-400 tracking-wider">${divName}</span>
                            <div class="flex items-center gap-2">
                                <input type="time" value="${m.timeSlot}" onchange="updateProp('${m.key}', 'timeSlot', this.value)" 
                                    class="bg-slate-100 border-none rounded px-2 py-1 text-xs font-bold text-slate-700 cursor-pointer w-24 hover:bg-slate-200">
                                <div class="flex items-center text-[10px] text-slate-500 font-bold uppercase bg-slate-100 px-2 py-1 rounded">
                                    Pitch <input type="number" value="${m.field}" onchange="updateProp('${m.key}', 'field', Number(this.value))" 
                                        class="ml-1 bg-transparent w-4 text-center text-slate-900 border-b border-slate-300 focus:outline-none">
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="goLive('${m.key}')" class="text-[10px] font-bold bg-green-50 text-green-600 px-2 py-1 rounded hover:bg-green-100 border border-green-100">GO LIVE</button>
                            <button onclick="deleteMatch('${m.key}')" class="text-slate-300 hover:text-red-500 px-2 text-lg leading-none">×</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div onclick="handleSwap('${m.key}', 'teamA', '${m.teamA}')" 
                             class="pill ${isSelectedA ? 'selected' : ''} flex-1 bg-slate-100 border border-slate-200 rounded py-3 px-1 text-center text-sm font-bold text-slate-700 truncate relative overflow-hidden">
                             ${m.teamA}
                        </div>
                        <div class="flex flex-col items-center w-12 shrink-0">
                            <span class="text-[10px] text-slate-300 font-bold mb-1">VS</span>
                            <div class="text-xs font-mono bg-slate-50 px-2 py-0.5 rounded border border-slate-100 text-slate-500">
                                ${m.scoreA}-${m.scoreB}
                            </div>
                        </div>
                        <div onclick="handleSwap('${m.key}', 'teamB', '${m.teamB}')" 
                             class="pill ${isSelectedB ? 'selected' : ''} flex-1 bg-slate-100 border border-slate-200 rounded py-3 px-1 text-center text-sm font-bold text-slate-700 truncate relative overflow-hidden">
                             ${m.teamB}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (container.innerHTML === '') {
                 container.innerHTML = `<div class="text-center py-8 text-sm text-slate-400">No matches found for Pitch ${filterVal}</div>`;
            }
        };

        // --- ACTIONS ---
        window.handleSwap = (key, field, currentTeamName) => {
            if (swapSource === null) {
                swapSource = { key, field, name: currentTeamName };
                document.getElementById('swapStatus').innerText = `Selected: ${currentTeamName}`;
                document.getElementById('swapStatus').classList.add('text-yellow-500', 'border-yellow-500');
                renderSchedule(); 
            } else {
                if (swapSource.key === key && swapSource.field === field) {
                    swapSource = null;
                    resetStatus();
                    return;
                }
                const target = { key, field, name: currentTeamName };
                const updates = {};
                updates[`tournaments/${eventId}/schedule/${swapSource.key}/${swapSource.field}`] = target.name;
                updates[`tournaments/${eventId}/schedule/${target.key}/${target.field}`] = swapSource.name;
                update(ref(db), updates).then(() => {
                    swapSource = null;
                    document.getElementById('swapStatus').innerText = "Swap Complete!";
                    setTimeout(resetStatus, 1500);
                });
            }
        };

        function resetStatus() {
            document.getElementById('swapStatus').innerText = "Tap team to swap";
            document.getElementById('swapStatus').classList.remove('text-yellow-500', 'border-yellow-500');
            renderSchedule();
        }

        window.updateProp = (key, field, val) => {
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val });
        };

        window.addMatch = () => {
            push(ref(db, `tournaments/${eventId}/schedule`), {
                timeSlot: "09:00", field: 1, teamA: "Team A", teamB: "Team B", 
                division: "Unassigned", scoreA: 0, scoreB: 0, status: "scheduled", timeRemaining: 1200
            });
        };

        window.deleteMatch = (key) => { if(confirm("Delete match?")) set(ref(db, `tournaments/${eventId}/schedule/${key}`), null); };

        window.goLive = async (key) => {
            const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
            const m = snap.val();
            update(ref(db, `tournaments/${eventId}/match`), {
                teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB,
                time: m.timeRemaining || 1200, isRunning: false, scheduleKey: key,
                division: m.division || ''
            });
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
        };

        window.stopGame = () => update(ref(db, `tournaments/${eventId}/match`), { isRunning: false, teamA: "--", teamB: "--", scoreA: 0, scoreB: 0 });
    </script>
</body>
</html>
