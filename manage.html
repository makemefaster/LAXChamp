<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager (Phase 2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <div class="bg-indigo-900 text-white p-4 rounded-xl mb-6 flex justify-between items-center shadow-lg sticky top-0 z-10">
        <div>
            <h1 class="font-bold text-lg">Phase 2: Editing</h1>
            <p class="text-xs text-indigo-300">Try changing a time or pitch.</p>
        </div>
        <div id="statusTag" class="text-xs bg-indigo-800 px-3 py-1 rounded-full font-bold">Connecting...</div>
    </div>

    <div id="matchList" class="space-y-3 max-w-xl mx-auto"></div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "No Event ID";

        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const list = document.getElementById('matchList');
            const status = document.getElementById('statusTag');

            if(!snap.exists()) {
                status.innerText = "0 Matches";
                list.innerHTML = "No data.";
                return;
            }

            // 1. CONVERT
            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            status.innerText = `${matches.length} Matches`;

            // 2. SORT (Chronological)
            matches.sort((a,b) => (a.timeSlot || "00:00").localeCompare(b.timeSlot || "00:00"));

            // 3. RENDER (Flat List with Inputs)
            list.innerHTML = '';
            matches.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3";
                
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-2">
                            <input type="time" value="${m.timeSlot}" onchange="edit('${m.key}', 'timeSlot', this.value)" 
                                class="bg-slate-100 font-bold text-sm px-2 py-1 rounded w-24 outline-none focus:ring-2 ring-indigo-500">
                            
                            <div class="flex items-center bg-slate-100 px-2 py-1 rounded">
                                <span class="text-[10px] font-bold text-slate-400 uppercase mr-1">Pitch</span>
                                <input type="number" value="${m.field}" onchange="edit('${m.key}', 'field', Number(this.value))" 
                                    class="bg-transparent font-bold text-sm w-8 outline-none text-center">
                            </div>
                        </div>
                        <span class="text-[10px] font-bold text-indigo-400 uppercase">${m.division || 'DIV'}</span>
                    </div>

                    <div class="flex justify-between items-center text-lg font-bold text-slate-700">
                        <span class="truncate w-1/3">${m.teamA}</span>
                        <span class="text-sm text-slate-300 font-normal">vs</span>
                        <span class="truncate w-1/3 text-right">${m.teamB}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        });

        // ACTION: Update Database
        window.edit = (key, field, val) => {
            console.log(`Updating ${key}: ${field} = ${val}`);
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val });
        };
    </script>
</body>
</html>
