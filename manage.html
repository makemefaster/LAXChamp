<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager (Phase 4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <div class="bg-indigo-900 text-white p-4 rounded-xl mb-6 flex justify-between items-center shadow-lg sticky top-0 z-10">
        <div>
            <h1 class="font-bold text-lg">Phase 4: Sanitized</h1>
            <p class="text-xs text-indigo-300">Strict Data Formatting</p>
        </div>
        <div id="statusTag" class="text-xs bg-indigo-800 px-3 py-1 rounded-full font-bold">Connecting...</div>
    </div>

    <div id="debugLog" class="text-xs font-mono text-slate-400 mb-4"></div>

    <div id="matchList" class="space-y-3 max-w-xl mx-auto"></div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "No Event ID";

        const debug = document.getElementById('debugLog');
        const log = (msg) => debug.innerHTML += `<div>${msg}</div>`;

        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const list = document.getElementById('matchList');
            const status = document.getElementById('statusTag');
            
            list.innerHTML = '';
            debug.innerHTML = '';

            if(!snap.exists()) {
                status.innerText = "0 Matches";
                list.innerHTML = "No data.";
                return;
            }

            // 1. EXTRACT DATA (Using Safe Mode Method)
            const rawData = snap.val();
            const matches = Object.keys(rawData).map(key => ({ key: key, ...rawData[key] }));
            
            status.innerText = `${matches.length} Matches Found`;
            log(`Loaded ${matches.length} matches from DB.`);

            // 2. SORT (Simple)
            matches.sort((a,b) => (a.timeSlot || "").localeCompare(b.timeSlot || ""));

            // 3. RENDER
            matches.forEach((m, i) => {
                try {
                    // SANITIZE TIME: Must be HH:MM (5 chars) to avoid input crash
                    let cleanTime = m.timeSlot || "";
                    if (cleanTime.length === 4) cleanTime = "0" + cleanTime; // Fix "9:00" -> "09:00"
                    if (!cleanTime.includes(":")) cleanTime = ""; // Clear bad data

                    const card = document.createElement('div');
                    card.className = `bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-3`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4 border-b border-slate-50 pb-2">
                            <div class="flex gap-2 items-center">
                                <span class="text-xs text-slate-400 font-mono">#${i+1}</span>
                                <input type="time" value="${cleanTime}" onchange="edit('${m.key}', 'timeSlot', this.value)" 
                                    class="bg-slate-100 font-bold text-sm px-2 py-1 rounded w-28 outline-none focus:ring-2 ring-indigo-500">
                                
                                <span class="bg-slate-100 text-xs font-bold px-2 py-1 rounded">
                                    P <input type="number" value="${m.field || 1}" onchange="edit('${m.key}', 'field', Number(this.value))" 
                                    class="bg-transparent w-4 text-center outline-none">
                                </span>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="goLive('${m.key}')" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded text-[10px] font-bold">LIVE</button>
                                <button onclick="del('${m.key}')" class="text-slate-300 hover:text-red-500 px-2">×</button>
                            </div>
                        </div>

                        <div class="flex justify-between items-center font-bold text-slate-700 text-lg">
                            <input type="text" value="${m.teamA}" onchange="edit('${m.key}', 'teamA', this.value)" class="w-1/3 bg-transparent outline-none focus:bg-slate-50">
                            
                            <div class="flex gap-1">
                                <input type="number" value="${m.scoreA}" onchange="edit('${m.key}','scoreA',Number(this.value))" class="w-8 text-center bg-slate-100 rounded text-sm py-1">
                                <span class="text-slate-300">-</span>
                                <input type="number" value="${m.scoreB}" onchange="edit('${m.key}','scoreB',Number(this.value))" class="w-8 text-center bg-slate-100 rounded text-sm py-1">
                            </div>

                            <input type="text" value="${m.teamB}" onchange="edit('${m.key}', 'teamB', this.value)" class="w-1/3 text-right bg-transparent outline-none focus:bg-slate-50">
                        </div>
                    `;
                    list.appendChild(card);
                    log(`Rendered match ${i+1}`);

                } catch (err) {
                    log(`ERROR rendering match ${i}: ${err.message}`);
                }
            });
        });

        // ACTIONS
        window.edit = (key, field, val) => update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val });
        window.del = (key) => { if(confirm("Delete?")) set(ref(db, `tournaments/${eventId}/schedule/${key}`), null); };
        
        window.goLive = async (key) => {
            const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
            const m = snap.val();
            update(ref(db, `tournaments/${eventId}/match`), {
                teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB,
                time: 1200, isRunning: false, scheduleKey: key, division: m.division || '', isFinal: false
            });
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
        };
    </script>
</body>
</html>
