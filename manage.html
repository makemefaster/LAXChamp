<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .match-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-32 font-sans text-slate-800">

    <div class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <h1 class="font-black text-lg text-slate-900 tracking-tight">Director Mode</h1>
        <div id="statusTag" class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1 rounded-full">Connecting...</div>
    </div>

    <div class="max-w-xl mx-auto p-4">

        <div class="bg-slate-800 rounded-xl p-4 mb-8 shadow-lg text-white">
            <h2 class="text-[10px] font-bold uppercase text-slate-400 mb-2 tracking-widest">📢 Live Announcements</h2>
            <div class="flex gap-2">
                <input type="text" id="alertMsg" placeholder="e.g. 10 min delay..." class="flex-1 bg-slate-700 border-none rounded px-3 py-2 text-sm text-white outline-none focus:ring-2 ring-indigo-500">
                <button onclick="sendAlert()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-4 py-2 rounded text-xs">SEND</button>
                <button onclick="clearAlert()" class="bg-slate-600 hover:bg-slate-500 text-slate-200 font-bold px-4 py-2 rounded text-xs">CLR</button>
            </div>
        </div>

        <div id="scheduleFeed" class="space-y-8">
            <div class="text-center py-12 text-slate-400 animate-pulse">Loading schedule...</div>
        </div>

    </div>

    <button onclick="addMatch()" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-2xl text-3xl flex items-center justify-center hover:bg-indigo-500 z-50 active:scale-95 transition">+</button>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "<div class='p-10'>No Event ID</div>";

        // LISTEN TO SCHEDULE
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const container = document.getElementById('scheduleFeed');
            const status = document.getElementById('statusTag');
            
            if(!snap.exists()) {
                status.innerText = "0 Matches";
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No matches found.<br><a href="admin.html?event=${eventId}" class="text-indigo-600 font-bold underline">Go to Setup</a></div>`;
                return;
            }

            // 1. Convert Data
            const matches = [];
            snap.forEach(c => matches.push({key: c.key, ...c.val()}));
            status.innerText = `${matches.length} Matches Found`;

            // 2. Group by Time Slot
            const groups = {};
            matches.forEach(m => {
                const time = m.timeSlot || "Unscheduled";
                if(!groups[time]) groups[time] = [];
                groups[time].push(m);
            });

            // 3. Render
            container.innerHTML = '';
            const sortedTimes = Object.keys(groups).sort();

            sortedTimes.forEach(time => {
                const groupMatches = groups[time].sort((a,b) => (a.field || 0) - (b.field || 0));
                
                // Time Header
                const section = document.createElement('div');
                section.innerHTML = `<h3 class="font-black text-2xl text-slate-300 mb-3 pl-1">${time}</h3>`;
                
                const grid = document.createElement('div');
                grid.className = "grid gap-3";

                groupMatches.forEach(m => {
                    const isLive = m.status === 'live';
                    const isDone = m.status === 'finished';
                    const divName = m.division || 'Match';
                    
                    const card = document.createElement('div');
                    card.className = `match-card bg-white border rounded-xl p-4 shadow-sm relative overflow-hidden transition ${isLive ? 'border-green-500 ring-2 ring-green-100' : 'border-slate-100'}`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2">
                                <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black uppercase tracking-wide">Pitch ${m.field}</span>
                                <span class="text-[10px] font-bold text-indigo-500 uppercase truncate max-w-[120px]">${divName}</span>
                            </div>
                            ${isLive 
                                ? `<button onclick="stopGame('${m.key}')" class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold animate-pulse">LIVE NOW</button>` 
                                : `<button onclick="goLive('${m.key}')" class="bg-slate-50 text-slate-400 hover:bg-indigo-50 hover:text-indigo-600 px-2 py-1 rounded text-[10px] font-bold transition">GO LIVE</button>`
                            }
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div class="flex-1 font-bold text-slate-700 truncate cursor-pointer hover:text-indigo-600" onclick="renameTeam('${m.key}', 'teamA', '${m.teamA}')">${m.teamA}</div>
                            <div class="px-3 font-mono font-bold text-slate-300 text-sm">vs</div>
                            <div class="flex-1 font-bold text-slate-700 truncate text-right cursor-pointer hover:text-indigo-600" onclick="renameTeam('${m.key}', 'teamB', '${m.teamB}')">${m.teamB}</div>
                        </div>

                        ${isDone ? `<div class="mt-2 text-center text-xs font-mono text-slate-400 pt-2 border-t border-slate-50">Final: ${m.scoreA} - ${m.scoreB}</div>` : ''}
                        
                        <button onclick="deleteMatch('${m.key}')" class="absolute bottom-1 right-1 p-2 text-slate-200 hover:text-red-400 text-xs">×</button>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        });

        // ACTIONS
        window.goLive = async (key) => {
            const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
            const m = snap.val();
            // Update Main Scoreboard
            update(ref(db, `tournaments/${eventId}/match`), {
                teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB,
                time: 1200, isRunning: false, scheduleKey: key, division: m.division || '', isFinal: false
            });
            // Mark as Live
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
        };

        window.stopGame = (key) => {
            if(confirm("Stop broadcasting?")) {
                update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'scheduled' });
                update(ref(db, `tournaments/${eventId}/match`), { isRunning: false });
            }
        };

        window.renameTeam = (key, field, current) => {
            const newName = prompt("Rename Team:", current);
            if(newName && newName !== current) update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: newName });
        };

        window.deleteMatch = (key) => { if(confirm("Delete match?")) set(ref(db, `tournaments/${eventId}/schedule/${key}`), null); };
        window.addMatch = () => push(ref(db, `tournaments/${eventId}/schedule`), { timeSlot: "09:00", field: 1, teamA: "Team A", teamB: "Team B", division: "Manual" });
        window.sendAlert = () => { const msg = document.getElementById('alertMsg').value; if(msg) set(ref(db, `tournaments/${eventId}/alert`), { message: msg, type: 'info' }); };
        window.clearAlert = () => set(ref(db, `tournaments/${eventId}/alert`), null);

    </script>
</body>
</html>
