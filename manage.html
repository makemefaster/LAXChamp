<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pill { cursor: pointer; user-select: none; transition: all 0.2s; }
        .pill:hover { transform: scale(1.02); filter: brightness(95%); }
        .pill.selected { 
            background-color: #fbbf24 !important; 
            color: black !important; 
            border-color: #f59e0b !important; 
            transform: scale(1.05); 
            font-weight: 900;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24">

    <div class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <a href="director.html" class="text-slate-400 hover:text-white">←</a>
            <h1 class="font-bold text-lg hidden md:block">Event Manager</h1>
            
            <select id="pitchFilter" onchange="renderSchedule()" class="bg-slate-800 text-xs border border-slate-700 rounded px-2 py-1 text-white">
                <option value="all">All Pitches</option>
                <option value="1">Pitch 1</option>
                <option value="2">Pitch 2</option>
                <option value="3">Pitch 3</option>
                <option value="4">Pitch 4</option>
            </select>
        </div>
        
        <div class="flex flex-col items-end">
            <div class="text-[10px] text-slate-400 uppercase font-bold">Matches Loaded: <span id="matchCount">0</span></div>
            <div id="swapStatus" class="text-xs font-mono bg-slate-800 px-2 py-0.5 rounded border border-slate-700 text-yellow-500 mt-1">Tap team to swap</div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">

        <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Live Scoreboard</h2>
                <button onclick="stopGame()" class="text-[10px] text-red-500 font-bold border border-red-100 px-2 py-1 rounded hover:bg-red-50">RESET</button>
            </div>
            <div class="flex items-center justify-center gap-4 bg-slate-50 p-4 rounded border">
                <div class="text-center w-1/3">
                    <div id="liveHome" class="font-black text-lg truncate">--</div>
                    <div id="liveScoreA" class="text-indigo-600 font-bold text-2xl">0</div>
                </div>
                <div class="text-slate-300 font-black text-xs">VS</div>
                <div class="text-center w-1/3">
                    <div id="liveAway" class="font-black text-lg truncate">--</div>
                    <div id="liveScoreB" class="text-indigo-600 font-bold text-2xl">0</div>
                </div>
            </div>
        </div>

        <div id="matchGrid" class="space-y-3">
            <div class="text-center text-slate-400 py-10 animate-pulse">Loading schedule...</div>
        </div>

    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');

        if(!eventId) window.location.href = 'director.html';
        onAuthStateChanged(auth, u => { if(!u) window.location.href='director.html'; });

        // STATE
        let swapSource = null; 
        let allMatches = []; // Local cache

        // 1. LIVE SCORE
        onValue(ref(db, `tournaments/${eventId}/match`), s => {
            const m = s.val() || { teamA:'--', teamB:'--', scoreA:0, scoreB:0 };
            document.getElementById('liveHome').innerText = m.teamA;
            document.getElementById('liveAway').innerText = m.teamB;
            document.getElementById('liveScoreA').innerText = m.scoreA;
            document.getElementById('liveScoreB').innerText = m.scoreB;
        });

        // 2. LOAD SCHEDULE (THE FIX)
        onValue(ref(db, `tournaments/${eventId}/schedule`), snap => {
            const rawData = snap.val();
            
            if(!rawData) {
                document.getElementById('matchGrid').innerHTML = `<div class="text-center py-8 text-slate-400">No matches found.</div>`;
                return;
            }

            // CRITICAL FIX: Use Object.entries to safely parse the Atomic Object
            allMatches = Object.entries(rawData).map(([key, val]) => ({
                key: key,
                ...val
            }));

            document.getElementById('matchCount').innerText = allMatches.length;

            // Sort: Time -> Pitch
            allMatches.sort((a,b) => {
                const timeA = a.timeSlot || '00:00';
                const timeB = b.timeSlot || '00:00';
                if(timeA !== timeB) return timeA.localeCompare(timeB);
                return (a.field || 0) - (b.field || 0);
            });

            renderSchedule();
        });

        // 3. RENDER UI
        window.renderSchedule = () => {
            const container = document.getElementById('matchGrid');
            const filterVal = document.getElementById('pitchFilter').value;
            
            container.innerHTML = '';

            allMatches.forEach(m => {
                // Filter Logic
                if (filterVal !== 'all' && String(m.field) !== filterVal) return;

                const isSelA = swapSource && swapSource.key === m.key && swapSource.field === 'teamA';
                const isSelB = swapSource && swapSource.key === m.key && swapSource.field === 'teamB';
                const divName = m.division || '-';

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg p-3 shadow-sm";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-50">
                        <div class="flex gap-2 items-center">
                            <input type="time" value="${m.timeSlot}" onchange="upd('${m.key}','timeSlot',this.value)" class="bg-slate-100 rounded px-1 w-16 text-xs font-bold">
                            <span class="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold uppercase">P${m.field}</span>
                            <span class="text-slate-400 text-[10px] font-black uppercase tracking-wide">${divName}</span>
                        </div>
                        <div class="flex gap-2">
                             <button onclick="goLive('${m.key}')" class="text-[10px] font-bold bg-green-50 text-green-600 px-2 py-1 rounded border border-green-100">GO LIVE</button>
                             <button onclick="del('${m.key}')" class="text-slate-300 hover:text-red-500 font-bold px-1">×</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div onclick="swap('${m.key}','teamA','${m.teamA}')" class="pill ${isSelA?'selected':''} flex-1 bg-slate-50 border rounded p-2 text-center text-sm font-bold truncate transition">${m.teamA}</div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-300">VS</span>
                            <div class="text-[10px] font-mono bg-slate-100 px-1 rounded">${m.scoreA}-${m.scoreB}</div>
                        </div>
                        <div onclick="swap('${m.key}','teamB','${m.teamB}')" class="pill ${isSelB?'selected':''} flex-1 bg-slate-50 border rounded p-2 text-center text-sm font-bold truncate transition">${m.teamB}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // ACTIONS
        window.swap = (key, field, name) => {
            if(!swapSource) {
                swapSource = { key, field, name };
                document.getElementById('swapStatus').innerText = `Selected: ${name}`;
                document.getElementById('swapStatus').classList.add('text-yellow-500');
                renderSchedule();
            } else {
                if(swapSource.key === key && swapSource.field === field) {
                    swapSource = null; // Cancel
                } else {
                    const updates = {};
                    updates[`tournaments/${eventId}/schedule/${swapSource.key}/${swapSource.field}`] = name;
                    updates[`tournaments/${eventId}/schedule/${key}/${field}`] = swapSource.name;
                    update(ref(db), updates);
                    swapSource = null;
                }
                document.getElementById('swapStatus').innerText = "Tap team to swap";
                document.getElementById('swapStatus').classList.remove('text-yellow-500');
                renderSchedule();
            }
        };

        window.upd = (k, f, v) => update(ref(db, `tournaments/${eventId}/schedule/${k}`), {[f]:v});
        window.del = (k) => { if(confirm("Delete match?")) set(ref(db, `tournaments/${eventId}/schedule/${k}`), null); };
        
        window.goLive = async (k) => {
            const s = await get(ref(db, `tournaments/${eventId}/schedule/${k}`));
            const m = s.val();
            update(ref(db, `tournaments/${eventId}/match`), { 
                teamA:m.teamA, teamB:m.teamB, scoreA:m.scoreA, scoreB:m.scoreB, scheduleKey:k, isRunning:false, division:m.division 
            });
            update(ref(db, `tournaments/${eventId}/schedule/${k}`), { status:'live' });
        };
        
        window.stopGame = () => update(ref(db, `tournaments/${eventId}/match`), { teamA:'--', teamB:'--', isRunning:false });

    </script>
</body>
</html>
