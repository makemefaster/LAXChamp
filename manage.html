<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager (Debug Phase 1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-mono text-sm">

    <div class="bg-slate-900 text-white p-4 rounded-xl mb-4 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="font-bold text-lg">Phase 1: Skeleton</h1>
            <p class="text-xs text-slate-400">Raw Data View</p>
        </div>
        <div id="statusTag" class="bg-blue-600 px-3 py-1 rounded font-bold">Connecting...</div>
    </div>

    <div id="errorLog" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

    <div id="matchList" class="space-y-2">
        </div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        if(!eventId) document.body.innerHTML = "<h1>ERROR: No Event ID</h1>";

        const logError = (msg) => {
            const el = document.getElementById('errorLog');
            el.innerText += msg + "\n";
            el.classList.remove('hidden');
        };

        // 1. RAW LISTENER
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const list = document.getElementById('matchList');
            const status = document.getElementById('statusTag');

            if(!snap.exists()) {
                status.innerText = "0 Matches";
                list.innerHTML = "<div class='p-4 text-center text-slate-400'>Database is Empty</div>";
                return;
            }

            // 2. SAFE CONVERSION
            const matches = [];
            snap.forEach(child => {
                matches.push({ key: child.key, ...child.val() });
            });

            status.innerText = `${matches.length} Matches`;

            // 3. RENDER (No Sorting, No Grouping)
            list.innerHTML = '';
            
            matches.forEach((m, i) => {
                try {
                    const card = document.createElement('div');
                    card.className = "bg-white p-3 rounded border border-slate-300 shadow-sm";
                    
                    // Sanitize values to prevent crashes if data is missing
                    const time = m.timeSlot || "NO TIME";
                    const pitch = m.field || "NO PITCH";
                    const tA = m.teamA || "???";
                    const tB = m.teamB || "???";

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-blue-600">[${i+1}] ${time} @ P${pitch}</span>
                            <span class="text-xs text-slate-400 font-mono">${m.key.substring(0,4)}...</span>
                        </div>
                        <div class="text-lg">
                            ${tA} <span class="text-slate-300">vs</span> ${tB}
                        </div>
                    `;
                    list.appendChild(card);
                } catch (err) {
                    logError(`Failed to render match index ${i}: ${err.message}`);
                }
            });

        }, (err) => {
            logError("Database Permission Error: " + err.message);
        });
    </script>
</body>
</html>
