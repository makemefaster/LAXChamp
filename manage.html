<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Dashboard (Safe Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-32 font-sans text-slate-800">

    <div class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="font-black text-lg text-slate-900 tracking-tight">Director (Safe Mode)</h1>
            <div id="rawCount" class="text-[10px] text-slate-400">Waiting for data...</div>
        </div>
        <div id="statusTag" class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1 rounded-full">Connecting...</div>
    </div>

    <div class="max-w-xl mx-auto p-4">

        <div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-xs font-mono"></div>

        <div id="scheduleFeed" class="space-y-4">
            <div class="text-center py-12 text-slate-400 animate-pulse">Scanning database...</div>
        </div>

    </div>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        if(!eventId) document.body.innerHTML = "No Event ID";

        // LISTEN TO SCHEDULE
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const container = document.getElementById('scheduleFeed');
            const status = document.getElementById('statusTag');
            const rawCount = document.getElementById('rawCount');
            const errorBox = document.getElementById('errorBox');
            
            if(!snap.exists()) {
                status.innerText = "0 Matches";
                container.innerHTML = "No matches found in DB.";
                return;
            }

            try {
                // 1. SAFE EXTRACTION
                // We use Object.values to ignore weird key names
                const rawData = snap.val();
                const matches = Object.keys(rawData).map(key => ({
                    key: key,
                    ...rawData[key]
                }));

                status.innerText = `${matches.length} Matches Found`;
                rawCount.innerText = `Database Keys: ${Object.keys(rawData).length}`;

                // 2. RENDER WITHOUT SORTING (To prevent crashes)
                container.innerHTML = '';
                
                matches.forEach((m, index) => {
                    // Safety checks for missing fields
                    const timeDisp = m.timeSlot || "MISSING TIME";
                    const pitchDisp = m.field || "??";
                    const divDisp = m.division || "No Division";
                    const teamA = m.teamA || "???";
                    const teamB = m.teamB || "???";
                    const isLive = m.status === 'live';

                    // Check for corrupted Time
                    const timeIsBad = timeDisp.includes('NaN') || timeDisp === "MISSING TIME";

                    const card = document.createElement('div');
                    card.className = `bg-white border rounded-xl p-4 shadow-sm relative ${isLive ? 'border-green-500 ring-2 ring-green-100' : 'border-slate-200'}`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2">
                                <span class="${timeIsBad ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'} px-2 py-1 rounded text-xs font-bold font-mono">
                                    ${timeDisp}
                                </span>
                                <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black uppercase">Pitch ${pitchDisp}</span>
                                <span class="text-[10px] font-bold text-indigo-500 uppercase truncate max-w-[100px]">${divDisp}</span>
                            </div>
                            <div class="text-[10px] text-slate-300 font-mono">#${index+1}</div>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div class="flex-1 font-bold text-slate-700 truncate">${teamA}</div>
                            <div class="px-3 font-mono font-bold text-slate-300 text-sm">vs</div>
                            <div class="flex-1 font-bold text-slate-700 truncate text-right">${teamB}</div>
                        </div>
                        
                        <div class="mt-3 flex justify-end gap-2 border-t pt-2 border-slate-50">
                             ${isLive 
                                ? `<button onclick="stopGame('${m.key}')" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded font-bold">LIVE</button>` 
                                : `<button onclick="goLive('${m.key}')" class="text-xs bg-slate-100 text-slate-500 hover:text-indigo-600 px-3 py-1 rounded font-bold">GO LIVE</button>`
                            }
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                errorBox.innerText = "CRASH DETECTED: " + err.message;
                errorBox.classList.remove('hidden');
            }
        });

        // ACTIONS
        window.goLive = async (key) => {
            const snap = await get(ref(db, `tournaments/${eventId}/schedule/${key}`));
            const m = snap.val();
            update(ref(db, `tournaments/${eventId}/match`), {
                teamA: m.teamA, teamB: m.teamB, scoreA: m.scoreA, scoreB: m.scoreB,
                time: 1200, isRunning: false, scheduleKey: key, division: m.division || '', isFinal: false
            });
            update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'live' });
        };

        window.stopGame = (key) => {
            if(confirm("Stop broadcasting?")) {
                update(ref(db, `tournaments/${eventId}/schedule/${key}`), { status: 'scheduled' });
                update(ref(db, `tournaments/${eventId}/match`), { isRunning: false });
            }
        };
    </script>
</body>
</html>
