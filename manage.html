<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen p-4 font-mono text-sm">

    <div class="mb-4 border-b pb-4 flex justify-between items-center">
        <h1 class="font-bold text-xl">Forensic Mode</h1>
        <div id="status" class="bg-blue-100 text-blue-800 px-2 py-1 rounded">Loading...</div>
    </div>

    <table class="w-full border-collapse border border-slate-400 mb-8">
        <thead class="bg-slate-100">
            <tr>
                <th class="border border-slate-300 p-2">#</th>
                <th class="border border-slate-300 p-2">Time (Raw)</th>
                <th class="border border-slate-300 p-2">Pitch</th>
                <th class="border border-slate-300 p-2">Teams</th>
                <th class="border border-slate-300 p-2">Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <h3 class="font-bold mt-8 mb-2">Database Raw Output:</h3>
    <pre id="rawDump" class="bg-black text-green-400 p-4 rounded overflow-auto h-64 text-xs">Waiting for data...</pre>

    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        // 1. DUMP RAW DATA
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const rawBox = document.getElementById('rawDump');
            const tbody = document.getElementById('tableBody');
            const status = document.getElementById('status');

            if(!snap.exists()) {
                status.innerText = "Empty DB";
                rawBox.innerText = "null";
                tbody.innerHTML = "<tr><td colspan='5' class='text-center p-4'>No Data</td></tr>";
                return;
            }

            // Print the EXACT JSON from DB
            const val = snap.val();
            rawBox.innerText = JSON.stringify(val, null, 2);

            // Convert to Array
            const matches = Object.keys(val).map(key => ({ key: key, ...val[key] }));
            status.innerText = `Found ${matches.length} Keys`;

            // 2. RENDER TABLE
            tbody.innerHTML = '';
            matches.forEach((m, i) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="border border-slate-300 p-2 text-center">${i+1}</td>
                    <td class="border border-slate-300 p-2">
                        <input type="text" value="${m.timeSlot || ''}" onchange="save('${m.key}','timeSlot',this.value)" class="border p-1 w-20">
                    </td>
                    <td class="border border-slate-300 p-2 text-center">
                        <input type="number" value="${m.field || 1}" onchange="save('${m.key}','field',Number(this.value))" class="border p-1 w-10 text-center">
                    </td>
                    <td class="border border-slate-300 p-2">
                        ${m.teamA} vs ${m.teamB}
                    </td>
                    <td class="border border-slate-300 p-2 text-center">
                         <button onclick="del('${m.key}')" class="text-red-600 font-bold">DELETE</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.save = (key, field, val) => update(ref(db, `tournaments/${eventId}/schedule/${key}`), { [field]: val });
        window.del = (key) => set(ref(db, `tournaments/${eventId}/schedule/${key}`), null);
    </script>
</body>
</html>
