<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score</title>
    <style>
        body{background:#1a1a1a;color:white;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;margin:0}
        .main-board{flex:1;display:flex;align-items:center;justify-content:center}
        .team{flex:1;text-align:center}.score{font-size:18vw;font-weight:bold}
        .timer{font-size:10vw;text-align:center;color:#f1c40f;font-family:monospace;background:black;padding:20px}
    </style>
</head>
<body>
    <div style="padding:20px;text-align:center;background:#222">TOURNAMENT CHAMP</div>
    <div class="main-board">
        <div class="team"><div id="nameA">HOME</div><div id="scoreA" class="score">0</div></div>
        <div class="team"><div id="nameB">AWAY</div><div id="scoreB" class="score">0</div></div>
    </div>
    <div id="timer" class="timer">00:00</div>

    <script type="module">
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const eventId = new URLSearchParams(window.location.search).get('event');
        if(!eventId) document.body.innerHTML = "<h1 style='text-align:center'>No Event Selected</h1>";

        onValue(ref(db, `tournaments/${eventId}/match`), (snap) => {
            const data = snap.val();
            if(!data) return;
            document.getElementById('nameA').innerText = data.teamA;
            document.getElementById('nameB').innerText = data.teamB;
            document.getElementById('scoreA').innerText = data.scoreA;
            document.getElementById('scoreB').innerText = data.scoreB;
            
            const m = Math.floor(data.time/60).toString().padStart(2,'0');
            const s = (data.time%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        });
    </script>
</body>
</html>
