<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans text-slate-800">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-black mb-6">Review Schedule</h1>

        <div id="errorConsole" class="hidden bg-red-900 text-white font-mono text-xs p-4 rounded mb-6 whitespace-pre-wrap border-4 border-red-500"></div>

        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6 flex justify-between items-center">
            <div>
                <p class="text-xs font-bold uppercase text-slate-400">First Whistle</p>
                <p id="startTime" class="text-2xl font-bold">--:--</p>
            </div>
            <div>
                <p class="text-xs font-bold uppercase text-slate-400">Total Matches</p>
                <p id="matchCount" class="text-2xl font-bold">0</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-8">
            <div class="bg-slate-50 p-3 border-b text-xs font-bold uppercase text-slate-500 grid grid-cols-12 gap-2">
                <div class="col-span-2">Time</div>
                <div class="col-span-2">Pitch</div>
                <div class="col-span-3">Division</div>
                <div class="col-span-5">Matchup</div>
            </div>
            <div id="matchList" class="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
                <div class="p-8 text-center text-slate-400 animate-pulse">Connecting to Database...</div>
            </div>
        </div>

        <div class="flex gap-4">
            <a id="backLink" href="#" class="px-6 py-4 rounded-xl font-bold text-slate-500 bg-white border shadow-sm hover:bg-slate-50">← Redo Setup</a>
            <a id="confirmLink" href="#" class="flex-1 px-6 py-4 rounded-xl font-bold text-white bg-green-600 shadow-lg hover:bg-green-500 text-center text-lg">
                ✅ Approve & Launch Manager
            </a>
        </div>
    </div>

    <script type="module">
        // 1. ERROR TRAP: Catches crash before imports work
        window.onerror = function(msg, url, line) {
            const box = document.getElementById('errorConsole');
            box.classList.remove('hidden');
            box.innerText += `CRITICAL ERROR:\n${msg}\nLine: ${line}\n\n`;
            return false;
        };

        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        // Log status
        const log = (txt) => {
            console.log(txt);
            // document.getElementById('errorConsole').classList.remove('hidden');
            // document.getElementById('errorConsole').innerText += `INFO: ${txt}\n`;
        };

        if(!eventId) {
            document.getElementById('errorConsole').classList.remove('hidden');
            document.getElementById('errorConsole').innerText = "ERROR: No Event ID in URL.\nDid you open this page directly?\nYou must go to admin.html first.";
            throw new Error("Missing Event ID");
        }

        // Links
        document.getElementById('backLink').href = `admin.html?event=${eventId}`;
        document.getElementById('confirmLink').href = `manage.html?event=${eventId}`;

        // --- LOAD DATA ---
        const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
        
        log(`Listening to: tournaments/${eventId}/schedule`);

        onValue(scheduleRef, (snapshot) => {
            log("Database connection successful. Reading data...");
            const rawData = snapshot.val();
            const list = document.getElementById('matchList');

            if (!rawData) {
                list.innerHTML = `
                    <div class="p-8 text-center">
                        <p class="text-red-500 font-bold text-lg mb-2">No Schedule Found</p>
                        <p class="text-slate-400 text-sm">The path 'tournaments/${eventId}/schedule' is empty.</p>
                        <p class="text-slate-400 text-xs mt-2">Possible reasons:</p>
                        <ul class="text-left text-xs text-slate-400 max-w-xs mx-auto list-disc mt-1">
                            <li>The Upload failed on the previous page.</li>
                            <li>You are looking at the wrong Event ID.</li>
                        </ul>
                    </div>`;
                return;
            }

            const matches = Object.values(rawData);
            log(`Found ${matches.length} matches.`);

            // Sort
            matches.sort((a,b) => {
                const timeA = a.timeSlot || '00:00';
                const timeB = b.timeSlot || '00:00';
                if(timeA !== timeB) return timeA.localeCompare(timeB);
                return (a.field || 0) - (b.field || 0);
            });

            // Update Header
            document.getElementById('matchCount').innerText = matches.length;
            if(matches.length > 0) document.getElementById('startTime').innerText = matches[0].timeSlot;

            // Render List
            list.innerHTML = '';
            matches.forEach(m => {
                const row = document.createElement('div');
                row.className = "p-3 text-sm grid grid-cols-12 gap-2 hover:bg-slate-50 transition";
                row.innerHTML = `
                    <div class="col-span-2 font-bold font-mono text-slate-600">${m.timeSlot}</div>
                    <div class="col-span-2"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-bold">P${m.field}</span></div>
                    <div class="col-span-3 truncate text-slate-500 text-xs uppercase font-bold pt-1">${m.division || '-'}</div>
                    <div class="col-span-5 font-medium truncate">${m.teamA} <span class="text-slate-300 mx-1">vs</span> ${m.teamB}</div>
                `;
                list.appendChild(row);
            });

        }, (error) => {
            // FIREBASE ERROR (Permission Denied etc)
            const box = document.getElementById('errorConsole');
            box.classList.remove('hidden');
            box.innerText += `FIREBASE ERROR:\n${error.code}\n${error.message}`;
        });

    </script>
</body>
</html>
