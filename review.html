<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans text-slate-800">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-black mb-6">Review Schedule</h1>

        <div id="debugBox" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 hidden">
            <p class="font-bold">Diagnostics:</p>
            <p id="debugMsg">Loading...</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6 flex justify-between items-center">
            <div>
                <p class="text-xs font-bold uppercase text-slate-400">First Whistle</p>
                <p id="startTime" class="text-2xl font-bold">--:--</p>
            </div>
            <div>
                <p class="text-xs font-bold uppercase text-slate-400">Last Whistle</p>
                <p id="endTime" class="text-2xl font-bold text-indigo-600">--:--</p>
            </div>
            <div>
                <p class="text-xs font-bold uppercase text-slate-400">Total Matches</p>
                <p id="matchCount" class="text-2xl font-bold">0</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-8">
            <div class="bg-slate-50 p-3 border-b text-xs font-bold uppercase text-slate-500 grid grid-cols-12 gap-2">
                <div class="col-span-2">Time</div>
                <div class="col-span-2">Pitch</div>
                <div class="col-span-3">Division</div>
                <div class="col-span-5">Matchup</div>
            </div>
            
            <div id="matchList" class="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
                <div class="p-8 text-center text-slate-400">Loading data...</div>
            </div>
        </div>

        <div class="flex gap-4">
            <a id="backLink" href="#" class="px-6 py-4 rounded-xl font-bold text-slate-500 bg-white border shadow-sm hover:bg-slate-50">← Redo Setup</a>
            <a id="confirmLink" href="#" class="flex-1 px-6 py-4 rounded-xl font-bold text-white bg-green-600 shadow-lg hover:bg-green-500 text-center text-lg">
                ✅ Approve & Launch Manager
            </a>
        </div>
    </div>

    <script type="module">
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        // Update Links
        if(eventId) {
            document.getElementById('backLink').href = `admin.html?event=${eventId}`;
            document.getElementById('confirmLink').href = `manage.html?event=${eventId}`;
        }

        // --- ROBUST DATA LOADER ---
        const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
        
        onValue(scheduleRef, (snapshot) => {
            const rawData = snapshot.val();
            const list = document.getElementById('matchList');
            const debugBox = document.getElementById('debugBox');
            const debugMsg = document.getElementById('debugMsg');

            // 1. HANDLE EMPTY DATA
            if (!rawData) {
                list.innerHTML = '<div class="p-8 text-center text-red-400">No schedule data found in database.</div>';
                debugBox.classList.remove('hidden');
                debugMsg.innerText = "Database returned null. Please go back and Generate again.";
                return;
            }

            // 2. CONVERT OBJECT TO ARRAY (The Fix)
            // This grabs all children, regardless of key format
            const matches = Object.values(rawData);
            
            // DIAGNOSTICS
            if(matches.length !== 15) {
                debugBox.classList.remove('hidden');
                debugMsg.innerText = `Warning: Database has ${matches.length} items. (Expected 15)`;
            }

            // 3. SORT
            matches.sort((a,b) => {
                const timeA = a.timeSlot || '00:00';
                const timeB = b.timeSlot || '00:00';
                if(timeA !== timeB) return timeA.localeCompare(timeB);
                return (a.field || 0) - (b.field || 0);
            });

            // 4. RENDER STATS
            document.getElementById('matchCount').innerText = matches.length;
            if (matches.length > 0) {
                document.getElementById('startTime').innerText = matches[0].timeSlot;
                document.getElementById('endTime').innerText = matches[matches.length-1].timeSlot + " (Start)";
            }

            // 5. RENDER LIST
            list.innerHTML = '';
