<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Consultant (Factory Fixed)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-8 font-sans text-slate-800">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl border border-slate-200 overflow-hidden">
        
        <div class="bg-slate-900 text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black">Tournament Director</h1>
                <p class="text-slate-400 text-sm">Constraint-based Format Engine</p>
            </div>
            <div id="dbStatus" class="text-xs bg-slate-800 px-3 py-1 rounded font-mono text-green-400">
                Checking Database...
            </div>
        </div>

        <div class="p-8">

            <div id="step1" class="step active">
                <h2 class="font-bold text-xl mb-6 text-indigo-600">1. Tournament Constraints</h2>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Teams</label>
                        <input type="number" id="teamCount" value="4" class="w-full p-3 border rounded font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Pitches</label>
                        <input type="number" id="pitchCount" value="2" class="w-full p-3 border rounded font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Game Mins</label>
                        <input type="number" id="gameDur" value="20" class="w-full p-3 border rounded font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Break Mins</label>
                        <input type="number" id="breakDur" value="5" class="w-full p-3 border rounded font-bold text-lg">
                    </div>
                </div>

                <button onclick="goToStep2()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">
                    Next: Setup Teams →
                </button>
            </div>

            <div id="step2" class="step">
                <h2 class="font-bold text-xl mb-4 text-indigo-600">2. Enter Teams</h2>
                <p class="text-sm text-slate-500 mb-4">Enter one team per line.</p>
                
                <textarea id="teamInput" class="w-full h-40 p-4 border rounded-xl font-mono text-sm mb-6 bg-slate-50" placeholder="Hurricanes&#10;Lions&#10;Titans&#10;..."></textarea>
                
                <button onclick="generateSchedule()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">
                    Generate Schedule ⚡
                </button>
            </div>

            <div id="step3" class="step">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-xl text-indigo-600">3. Review Schedule</h2>
                    <span id="previewCount" class="bg-indigo-100 text-indigo-800 px-2 py-1 rounded text-xs font-bold">0 Matches</span>
                </div>

                <div class="bg-slate-50 border rounded-xl overflow-hidden max-h-64 overflow-y-auto mb-6">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-200 text-xs uppercase font-bold text-slate-500 sticky top-0">
                            <tr>
                                <th class="p-3">Time</th>
                                <th class="p-3">Pitch</th>
                                <th class="p-3">Matchup</th>
                            </tr>
                        </thead>
                        <tbody id="previewBody" class="divide-y divide-slate-200"></tbody>
                    </table>
                </div>

                <div class="flex gap-4">
                    <button onclick="window.location.reload()" class="flex-1 bg-slate-200 text-slate-700 font-bold py-3 rounded-xl">
                        ← Restart
                    </button>
                    <button id="uploadBtn" onclick="uploadToDatabase()" class="flex-2 w-2/3 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg">
                        Confirm & Upload to Database ✅
                    </button>
                </div>
            </div>

        </div>

        <div class="bg-black text-green-400 p-4 text-xs font-mono border-t border-slate-800">
            <div class="font-bold text-white mb-2 uppercase tracking-widest">Live Database Inspector</div>
            <div id="dbInspector">Connecting...</div>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        let pendingMatches = []; 

        if(!eventId) document.body.innerHTML = "<h1>ERROR: No Event ID</h1>";
        
        // --- 1. MONITOR THE DB (Quality Control) ---
        onValue(ref(db, `tournaments/${eventId}/schedule`), (snap) => {
            const insp = document.getElementById('dbInspector');
            const status = document.getElementById('dbStatus');
            
            if(!snap.exists()) {
                insp.innerText = "Current Status: Database is EMPTY (0 matches)";
                status.innerText = "DB: Empty";
                return;
            }
            
            const data = snap.val();
            const count = Object.keys(data).length;
            const sample = Object.values(data)[0];
            
            insp.innerHTML = `
                STATUS: Found ${count} matches.<br>
                SAMPLE: [${sample.timeSlot}] ${sample.teamA} vs ${sample.teamB} (Pitch ${sample.field})
            `;
            status.innerText = `DB: ${count} Matches`;
        });

        window.goToStep2 = () => {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            // Auto-fill dummy teams for testing
            const count = parseInt(document.getElementById('teamCount').value) || 4;
            let text = "";
            for(let i=1; i<=count; i++) text += `Team ${i}\n`;
            document.getElementById('teamInput').value = text.trim();
        };

        // --- 2. GENERATE SCHEDULE (Tetris Logic) ---
        window.generateSchedule = () => {
            const teams = document.getElementById('teamInput').value.split('\n').filter(t => t.trim());
            const pitchCount = parseInt(document.getElementById('pitchCount').value);
            const gameDur = parseInt(document.getElementById('gameDur').value);
            const breakDur = parseInt(document.getElementById('breakDur').value);
            const slotDur = gameDur + breakDur;

            // Generate Matchups (Round Robin)
            let queue = [];
            for(let i=0; i<teams.length; i++) {
                for(let j=i+1; j<teams.length; j++) {
                    queue.push({ teamA: teams[i], teamB: teams[j] });
                }
            }

            // Schedule them
            pendingMatches = [];
            let pitch clocks = Array(pitchCount).fill(0); // Minutes from 09:00
            const START_MINS = 9 * 60; // 09:00 AM

            queue.forEach(m => {
                // Find pitch with earliest availability
                let bestPitch = 0;
                for(let p=1; p<pitchCount; p++) {
                    if (clocks[p] < clocks[bestPitch]) bestPitch = p;
                }

                const startTime = START_MINS + clocks[bestPitch];
                const h = Math.floor(startTime / 60);
                const min = startTime % 60;
                const timeStr = `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;

                pendingMatches.push({
                    teamA: m.teamA,
                    teamB: m.teamB,
                    timeSlot: timeStr,
                    field: bestPitch + 1,
                    division: "League",
                    scoreA: 0,
                    scoreB: 0,
                    status: 'scheduled'
                });

                // Advance clock
                clocks[bestPitch] += slotDur;
            });

            // Show Preview
            const tbody = document.getElementById('previewBody');
            tbody.innerHTML = '';
            pendingMatches.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-mono font-bold">${m.timeSlot}</td>
                        <td class="p-3">Pitch ${m.field}</td>
                        <td class="p-3">${m.teamA} vs ${m.teamB}</td>
                    </tr>
                `;
            });
            document.getElementById('previewCount').innerText = `${pendingMatches.length} Matches`;

            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        };

        // --- 3. UPLOAD (Safe Push) ---
        window.uploadToDatabase = async () => {
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Uploading..."; btn.disabled = true;

            const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
            
            // 1. CLEAR OLD DATA
            await set(scheduleRef, null);

            // 2. PUSH NEW MATCHES
            for(const m of pendingMatches) {
                await push(scheduleRef, m);
            }

            // 3. RESET SCOREBOARD
            await set(ref(db, `tournaments/${eventId}/match`), { 
                teamA: "--", teamB: "--", scoreA: 0, scoreB: 0, isRunning: false 
            });

            btn.innerText = "Done! Redirecting...";
            setTimeout(() => {
                window.location.href = `manage.html?event=${eventId}`;
            }, 1000);
        };
    </script>
</body>
</html>
