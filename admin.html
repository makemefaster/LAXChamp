<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Consultant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step { display: none; }
        .step.active { display: block; animation: fadein 0.4s; }
        @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .option-card { transition: all 0.2s; border: 2px solid transparent; }
        .option-card:hover { transform: translateY(-2px); shadow: lg; }
        .option-card.recommended { border-color: #22c55e; background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans text-slate-800">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-2xl border border-slate-100 overflow-hidden">
        
        <div class="bg-slate-900 text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black">Tournament Consultant</h1>
                <p class="text-slate-400 text-sm">Design your perfect schedule.</p>
            </div>
            <div class="text-xs font-bold uppercase tracking-widest bg-slate-800 px-3 py-1 rounded">Step <span id="stepNum">1</span>/3</div>
        </div>

        <div class="p-8">

            <div id="step1" class="step active">
                <h2 class="font-bold text-xl mb-6 text-indigo-600">1. The Basics</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Total Teams</label>
                        <input type="number" id="teamCount" value="12" class="w-full p-4 border rounded-xl font-bold text-lg bg-slate-50 focus:ring-2 ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Pitches</label>
                        <input type="number" id="pitchCount" value="3" class="w-full p-4 border rounded-xl font-bold text-lg bg-slate-50 focus:ring-2 ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Divisions</label>
                        <input type="number" id="divCount" value="2" class="w-full p-4 border rounded-xl font-bold text-lg bg-slate-50 focus:ring-2 ring-indigo-500 outline-none">
                        <p class="text-[10px] text-slate-400 mt-1">e.g. U15 and U18</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Game Length (Mins)</label>
                        <input type="number" id="gameDur" value="30" class="w-full p-3 border rounded font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Changeover (Mins)</label>
                        <input type="number" id="breakDur" value="7" class="w-full p-3 border rounded font-bold">
                    </div>
                </div>

                <button onclick="calculateOptions()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition transform active:scale-95">Analyze & Suggest Formats ✨</button>
            </div>

            <div id="step2" class="step">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-bold text-xl text-indigo-600">2. Recommended Formats</h2>
                    <button onclick="changeStep(1)" class="text-sm text-slate-400 hover:text-indigo-500">← Change Inputs</button>
                </div>
                
                <div id="optionsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div id="step3" class="step">
                <h2 class="font-bold text-xl mb-4 text-indigo-600">3. Enter Teams</h2>
                
                <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl mb-6">
                    <p class="text-sm text-indigo-800 font-bold" id="chosenFormatDisplay">--</p>
                    <p class="text-xs text-indigo-600 mt-1" id="chosenDetailsDisplay">--</p>
                </div>

                <div id="divisionInputs" class="space-y-4 mb-6">
                    </div>

                <button id="genBtn" onclick="generateFinal()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg">Generate Schedule 🚀</button>
            </div>

        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        
        let config = {}; 

        if(!eventId) window.location.href="director.html";
        onAuthStateChanged(auth, u=>{if(!u)window.location.href="director.html"});

        window.changeStep = (n) => {
            document.querySelectorAll('.step').forEach(e => e.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
            document.getElementById('stepNum').innerText = n;
        };

        // --- CALCULATOR ---
        window.calculateOptions = () => {
            const teamTotal = parseInt(document.getElementById('teamCount').value);
            const divCount = parseInt(document.getElementById('divCount').value);
            const pitches = parseInt(document.getElementById('pitchCount').value);
            const slotDur = parseInt(document.getElementById('gameDur').value) + parseInt(document.getElementById('breakDur').value);
            const teamsPerDiv = Math.ceil(teamTotal / divCount);
            
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            const matchesPerDiv = (teamsPerDiv * (teamsPerDiv - 1)) / 2;
            const blockTime = Math.ceil(matchesPerDiv / pitches) * slotDur;
            
            addOptionCard({
                title: "Blocked Schedule",
                icon: "🧱",
                desc: `Finish Division 1 before starting Division 2.`,
                detail: `Good for separate arrival times.`,
                mins: blockTime * divCount,
                type: 'block',
                param: divCount
            });

            if(divCount >= 2) {
                addOptionCard({
                    title: "Weaved / Interleaved",
                    icon: "🧶",
                    desc: `Alternate divisions (A-B-A-B).`,
                    detail: `Built-in rest periods. Keeps pitches full.`,
                    mins: blockTime * divCount,
                    type: 'weave',
                    param: divCount,
                    recommended: true
                });
            }

            changeStep(2);
        };

        function addOptionCard({ title, icon, desc, detail, mins, type, param, recommended }) {
            const div = document.createElement('div');
            div.className = `option-card bg-white p-6 rounded-xl border shadow-sm relative cursor-pointer ${recommended ? 'recommended' : ''}`;
            div.onclick = () => selectFormat(type, param, title);

            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div class="text-3xl">${icon}</div>
                    <div class="text-right">
                        <span class="block text-2xl font-black text-slate-800">${Math.floor(mins/60)}h ${mins%60}m</span>
                    </div>
                </div>
                <h3 class="font-bold text-lg mb-1">${title}</h3>
                <p class="text-sm text-slate-500 mb-2">${desc}</p>
                <p class="text-xs text-indigo-600 bg-indigo-50 p-2 rounded">${detail}</p>
                ${recommended ? '<div class="absolute top-2 right-2 text-[10px] bg-green-500 text-white px-2 py-1 rounded-full font-bold">RECOMMENDED</div>' : ''}
            `;
            document.getElementById('optionsGrid').appendChild(div);
        }

        window.selectFormat = (type, param, title) => {
            config = { type, param, title };
            document.getElementById('chosenFormatDisplay').innerText = title;
            document.getElementById('chosenDetailsDisplay').innerText = `Setup for ${param} Divisions`;

            const container = document.getElementById('divisionInputs');
            container.innerHTML = '';
            for(let i=1; i<=param; i++) {
                container.innerHTML += `
                    <div class="bg-slate-50 p-3 rounded border">
                        <div class="flex justify-between mb-1">
                            <input type="text" id="divName${i}" value="${i===1?'U15':(i===2?'U18':`Div ${i}`)}" class="bg-transparent font-bold text-sm">
                            <span id="count${i}" class="text-[10px] text-slate-400 font-bold uppercase">0 Teams</span>
                        </div>
                        <textarea id="divTeams${i}" oninput="updateCount(${i})" placeholder="Paste Teams Here" class="w-full p-2 text-sm border rounded h-24 font-mono"></textarea>
                    </div>
                `;
            }
            changeStep(3);
        };

        // --- HELPER TO COUNT TEAMS LIVE ---
        window.updateCount = (i) => {
            const raw = document.getElementById(`divTeams${i}`).value;
            // Clean split: remove quotes, newlines, commas
            const teams = raw.replace(/"/g, '').split(/[\n,]+/).map(t=>t.trim()).filter(t=>t.length > 1);
            const badge = document.getElementById(`count${i}`);
            badge.innerText = `${teams.length} Teams`;
            
            if(teams.length < 2) { badge.classList.add('text-red-500'); badge.classList.remove('text-green-500'); }
            else { badge.classList.remove('text-red-500'); badge.classList.add('text-green-500'); }
        };

        // --- GENERATOR ---
        window.generateFinal = async () => {
            const btn = document.getElementById('genBtn');
            const slotDur = parseInt(document.getElementById('gameDur').value) + parseInt(document.getElementById('breakDur').value);
            const pitchCount = parseInt(document.getElementById('pitchCount').value);
            
            // 1. GATHER TEAMS
            let divisions = [];
            let totalTeams = 0;
            
            for(let i=1; i<=config.param; i++) {
                const name = document.getElementById(`divName${i}`).value;
                const raw = document.getElementById(`divTeams${i}`).value;
                // CLEAN INPUT: Remove quotes, extra spaces
                const teams = raw.replace(/"/g, '').split(/[\n,]+/).map(t=>t.trim()).filter(t=>t.length > 1);
                
                if(teams.length < 2) return alert(`Division "${name}" has less than 2 teams. Please check your list.`);
                
                divisions.push({ name, teams });
                totalTeams += teams.length;
            }

            if(!confirm(`Ready to generate schedule for ${totalTeams} teams across ${divisions.length} divisions?`)) return;

            btn.innerText = "Generating..."; btn.disabled = true;

            // 2. BUILD MATCHES
            let allMatches = [];
            divisions.forEach(div => {
                for(let i=0; i<div.teams.length; i++) {
                    for(let j=i+1; j<div.teams.length; j++) {
                        allMatches.push({ 
                            teamA: div.teams[i], teamB: div.teams[j], 
                            division: div.name, status: 'scheduled', scoreA:0, scoreB:0 
                        });
                    }
                }
            });

            // 3. WEAVE LOGIC
            if(config.type === 'weave') {
                const matchesByDiv = {};
                divisions.forEach(d => matchesByDiv[d.name] = allMatches.filter(m => m.division === d.name));
                
                let weaved = [];
                // Calculate max matches in any single division
                const maxLen = Math.max(...Object.values(matchesByDiv).map(arr => arr.length));
                
                for(let i=0; i<maxLen; i++) {
                    divisions.forEach(d => {
                        const m = matchesByDiv[d.name][i];
                        if(m) weaved.push(m);
                    });
                }
                allMatches = weaved;
            }

            // 4. ASSIGN PITCHES
            const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
            await set(scheduleRef, null);

            let pitchTimes = Array(pitchCount).fill(9 * 60 + 40); // 09:40 Start
            const toTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
            
            const promises = allMatches.map(m => {
                let pIdx = 0;
                for(let p=1; p<pitchCount; p++) if(pitchTimes[p] < pitchTimes[pIdx]) pIdx = p;
                
                m.field = pIdx + 1;
                m.timeSlot = toTime(pitchTimes[pIdx]);
                
                pitchTimes[pIdx] += slotDur;
                return push(scheduleRef, m);
            });

            await set(ref(db, `tournaments/${eventId}/match`), { teamA:"TBD", teamB:"TBD", scoreA:0, scoreB:0, isRunning:false });
            Promise.all(promises).then(() => window.location.href = `manage.html?event=${eventId}`);
        };
    </script>
</body>
</html>
