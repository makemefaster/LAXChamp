<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.step { display: none; } .step.active { display: block; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans text-slate-800">

    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
        <h1 class="text-2xl font-black text-slate-800 mb-6">Event Setup</h1>

        <div id="step1" class="step active">
            <h2 class="font-bold text-lg mb-4 text-indigo-600">1. Logistics</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400">Total Slot (Mins)</label>
                    <input type="number" id="slotDuration" value="30" class="w-full p-3 bg-slate-50 border rounded font-bold">
                    <p class="text-[10px] text-slate-400">Game + Halftime + Changeover</p>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400">First Game</label>
                    <input type="time" id="startTime" value="09:00" class="w-full p-3 bg-slate-50 border rounded font-bold">
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase text-slate-400">Number of Pitches</label>
                <input type="number" id="fieldCount" value="3" class="w-full p-3 bg-slate-50 border rounded font-bold">
            </div>
            <button onclick="changeStep(2)" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Next: Teams</button>
        </div>

        <div id="step2" class="step">
            <h2 class="font-bold text-lg mb-4 text-indigo-600">2. Divisions & Teams</h2>
            <div class="bg-slate-50 p-4 rounded-xl border mb-4">
                <input type="text" id="divName" placeholder="Division Name" class="w-full mb-2 p-2 border rounded text-sm">
                <textarea id="teamList" placeholder="Team Names (one per line)" class="w-full p-2 border rounded text-sm h-24"></textarea>
                <button onclick="addDivision()" class="mt-2 w-full bg-slate-800 text-white text-xs font-bold py-2 rounded">Add Division</button>
            </div>
            <div id="divisionDisplay" class="space-y-2 mb-6 text-sm text-slate-600"></div>
            <button id="genBtn" onclick="generate()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">Generate & Review Schedule</button>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        const divisions = [];

        if(!eventId) window.location.href = "director.html";
        onAuthStateChanged(auth, user => { if (!user) window.location.href = "director.html"; });

        window.changeStep = (n) => {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
        };

        window.addDivision = () => {
            const name = document.getElementById('divName').value;
            const teams = document.getElementById('teamList').value.split('\n').map(t=>t.trim()).filter(t=>t);
            if(!name || teams.length < 2) return alert("Need name and 2+ teams");
            divisions.push({ name, teams });
            document.getElementById('divisionDisplay').innerHTML += `<div class="bg-white p-2 border shadow-sm"><strong>${name}</strong>: ${teams.length} Teams</div>`;
            document.getElementById('divName').value = ''; document.getElementById('teamList').value = '';
        };

        window.generate = async () => {
            if(divisions.length === 0) return alert("Add a division first!");
            document.getElementById('genBtn').innerText = "Calculating...";

            // 1. Settings
            const slotDur = parseInt(document.getElementById('slotDuration').value);
            const pitchCount = parseInt(document.getElementById('fieldCount').value);
            let currentTime = document.getElementById('startTime').value;

            // 2. Build Match Queue
            let matchQueue = [];
            divisions.forEach(div => {
                for(let i=0; i<div.teams.length; i++) {
                    for(let j=i+1; j<div.teams.length; j++) {
                        matchQueue.push({ teamA: div.teams[i], teamB: div.teams[j], division: div.name, status: 'scheduled', scoreA:0, scoreB:0 });
                    }
                }
            });

            // 3. Assign Slots
            const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
            await set(scheduleRef, null); // Clear old

            const addMins = (t, m) => {
                let [hh, mm] = t.split(':').map(Number);
                mm += m; hh += Math.floor(mm/60); mm %= 60;
                return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
            };

            let currentPitch = 1;
            const promises = matchQueue.map(match => {
                match.timeSlot = currentTime;
                match.field = currentPitch;
                
                currentPitch++;
                if(currentPitch > pitchCount) {
                    currentPitch = 1;
                    currentTime = addMins(currentTime, slotDur);
                }
                return push(scheduleRef, match);
            });

            // 4. Save Logistics Metadata
            await set(ref(db, `tournaments/${eventId}/settings`), { slotDur, pitchCount, startTime: document.getElementById('startTime').value });
            
            Promise.all(promises).then(() => {
                // REDIRECT TO REVIEW PAGE
                window.location.href = `review.html?event=${eventId}`;
            });
        };
    </script>
</body>
</html>
