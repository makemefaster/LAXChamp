<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.step { display: none; } .step.active { display: block; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-6 font-sans text-slate-800">

    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
        <h1 class="text-2xl font-black text-slate-800 mb-2">Event Setup</h1>
        <div class="flex justify-between items-center mb-6">
             <p class="text-slate-500 text-sm">Logistics & Scheduling</p>
             <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-bold">Step <span id="stepNum">1</span>/3</span>
        </div>

        <div id="step1" class="step active">
            <h2 class="font-bold text-lg mb-4 text-indigo-600">1. Logistics</h2>
            
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase text-slate-400">Total Slot Duration (Mins)</label>
                <input type="number" id="slotDur" value="30" class="w-full p-3 border rounded font-bold text-lg">
                <p class="text-[10px] text-slate-400">Includes Game + Half Time + Changeover</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400">Pitch Count</label>
                    <input type="number" id="pitchCount" value="3" class="w-full p-3 border rounded font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400">First Game</label>
                    <input type="time" id="startTime" value="09:00" class="w-full p-3 border rounded font-bold">
                </div>
            </div>

            <button onclick="changeStep(2)" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl">Next: Teams</button>
        </div>

        <div id="step2" class="step">
            <h2 class="font-bold text-lg mb-4 text-indigo-600">2. Teams</h2>
            
            <div class="bg-slate-50 p-4 rounded-xl border mb-4">
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Division Name</label>
                <input type="text" id="divName" placeholder="e.g. U15" class="w-full mb-2 p-2 border rounded">
                
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Team List</label>
                <textarea id="teamList" placeholder="Paste teams here..." class="w-full p-2 border rounded h-24"></textarea>
                
                <button onclick="addDivision()" class="mt-2 w-full bg-indigo-100 text-indigo-700 font-bold py-2 rounded text-xs">Add Division</button>
            </div>

            <div id="divisionDisplay" class="space-y-2 mb-6"></div>

            <div class="flex gap-2">
                <button onclick="changeStep(1)" class="w-1/3 bg-slate-200 font-bold py-3 rounded-xl">Back</button>
                <button onclick="changeStep(3)" class="w-2/3 bg-slate-800 text-white font-bold py-3 rounded-xl">Next: Generate</button>
            </div>
        </div>

        <div id="step3" class="step">
            <h2 class="font-bold text-lg mb-4 text-indigo-600">3. Confirmation</h2>
            <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-sm text-yellow-800 mb-6">
                Please confirm:
                <ul class="list-disc pl-5 mt-2 space-y-1">
                    <li>Pitch 1, 2, 3 will be used evenly.</li>
                    <li>Matches follow "Round Robin" (Everyone plays everyone).</li>
                    <li>6 Teams = 15 Matches.</li>
                </ul>
            </div>
            <button id="genBtn" onclick="generate()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg">Generate Schedule 🚀</button>
        </div>

    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        import { app, db } from './firebase-config.js';

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('event');
        const divisions = [];

        if(!eventId) window.location.href="director.html";
        onAuthStateChanged(auth, u=>{if(!u)window.location.href="director.html"});

        window.changeStep = (n) => {
            document.querySelectorAll('.step').forEach(e => e.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
            document.getElementById('stepNum').innerText = n;
        };

        window.addDivision = () => {
            const name = document.getElementById('divName').value;
            const teams = document.getElementById('teamList').value.split(/[\n,]+/).map(t=>t.trim()).filter(t=>t);
            if(!name || teams.length<2) return alert("Need name and 2+ teams");
            
            divisions.push({ name, teams });
            document.getElementById('divisionDisplay').innerHTML += `<div class="bg-white p-3 border rounded text-sm"><strong>${name}</strong>: ${teams.length} Teams</div>`;
            document.getElementById('divName').value=''; document.getElementById('teamList').value='';
        };

        // --- ROBUST GENERATOR ---
        const addMins = (t, m) => {
            let [hh,mm]=t.split(':').map(Number);
            mm+=m; hh+=Math.floor(mm/60); mm%=60;
            return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
        };

        window.generate = async () => {
            if(divisions.length === 0) return alert("Add a division first!");

            // 1. GATHER MATCHES
            let matches = [];
            divisions.forEach(div => {
                for(let i=0; i<div.teams.length; i++) {
                    for(let j=i+1; j<div.teams.length; j++) {
                        matches.push({
                            teamA: div.teams[i], teamB: div.teams[j], 
                            division: div.name, status: 'scheduled', scoreA:0, scoreB:0
                        });
                    }
                }
            });

            if(!confirm(`I calculated ${matches.length} matches for ${divisions[0].teams.length} teams.\n\n(Formula: N x (N-1) / 2)\n\nProceed?`)) return;

            const btn = document.getElementById('genBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const scheduleRef = ref(db, `tournaments/${eventId}/schedule`);
            await set(scheduleRef, null);

            // 2. DISTRIBUTE (Dealing Cards Logic)
            const pitchCount = parseInt(document.getElementById('pitchCount').value);
            const slotDur = parseInt(document.getElementById('slotDur').value);
            let startTime = document.getElementById('startTime').value;

            // Pitch Trackers: [ "09:00", "09:00", "09:00" ]
            let pitchTimes = Array(pitchCount).fill(startTime);

            const promises = matches.map((match, index) => {
                // Round Robin assignment: Match 0 -> Pitch 0, Match 1 -> Pitch 1...
                const pitchIndex = index % pitchCount; // 0, 1, 2, 0, 1, 2...
                const pitchId = pitchIndex + 1;        // 1, 2, 3...

                match.field = pitchId;
                match.timeSlot = pitchTimes[pitchIndex];

                // Update that pitch's next available time
                pitchTimes[pitchIndex] = addMins(pitchTimes[pitchIndex], slotDur);

                return push(scheduleRef, match);
            });

            // Init Match
            await set(ref(db, `tournaments/${eventId}/match`), { teamA:"TBD", teamB:"TBD", scoreA:0, scoreB:0, isRunning:false });

            Promise.all(promises).then(() => {
                window.location.href = `review.html?event=${eventId}`;
            });
        };
    </script>
</body>
</html>
